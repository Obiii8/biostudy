isms\nPlacozoans\n\nBrown algae\n\nSimple multicellular organisms that attain large sizes\n\nSimple multicellular organisms that divide by fission\n\nDictyostelium discoideum \u2013 cellular slime mould\n\nSingle-cell organisms that\naggregate to form a colony\nwith distinct cell types\nSadava 1 1e Fig. 26 .18, 10e Fig. 2 7.18\n\nhttps://www.youtube.com/watch?v=nQQJNIJbzd8\n\nPage [12]\n\nUnicellular and multicellular organisms\nIn all eukaryotic kingdoms except plants and animals, there are examples of\nunicellular and multicellular organisms.\nSaccharomyces\n\nParamecium\n\nSingle-celled\nphotosynthetic protists\n\nSingle-celled\n(but form colonies\ntoo)\n\nSingle-celled\nHeterotrophic protist\n\nEucalyptus\n\nMacrocystis\n\nAgaricus\n\nPhysarum\n\nMulticellular\nland plant\n\nMulticellular\nphotosynthetic protists\n\nMulticellular fungi\n\nMulticellular\nheterotrophic protists\n\nChlamydomonas\n\nSingle-celled Green\nalga (protist)\n\nVarious diatoms\n\nEnterococcus\n\nSingle-celled\n\ndelta\nproteobacteria\n\nMulticellular colonial\nbacteria Page [13]\n\nMulticellularity: An intriguing question about\nthe origins of complexity and diversity of life\n\nPage [14]\n\nOrigins of multicellularity\nSimplified evolutionary tree showing the relationship between various groups of organisms.\nFossil evidence for eukaryote emergence but not divergence of eukaryotes.\nMolecular clock provides an estimate of the divergence time of eukaryotes.\n\nchloroplast\n\nBACTERIA\nPLANTS\n\nmitochondria\n\nFUNGI\neukaryotes\n\nANIMALS\nARCHAEA\n\n2.1 Bya\nEukaryotes emerged\n\nMolecular clock: technique used to\nestimate the time when two or more\nlife forms diverged and is based on\nthe mutations rate of DNA.\n\n1.6 Bya\nCommon ancestor of animals\nand plants\n\nLast common ancestor of plant\nand animals is likely to have\nbeen unicellular\nPage [15]\n\nOrigins of multicellularity\nCombining molecular clock data with fossil record suggests multicellularity arose at least 6 times.\n\nCnidaria\nAnomalocaris - Wikipedia\n\nAnimals\n\nPlacozoans\nFirst multicellular algal fossils\n(~600 Mya \u2013 Lantian Biota)\n\nBasidiomycetes Sponges\n/Ascomycetes\nFungi\nLand plants\nCambrian explosion!\n(~540Mya \u2013 Burgess Shale)\n\nRed algae\nSlime moulds\n\nChoanoflagellates\nGreen algae\nBrown algae\n\nFirst multicellular\nanimal fossils\n(~600Mya \u2013\nEdiacaran fauna)\n\nSingle celled\ncommon\nancestor\n\nOomycetes\n\n1.6 Bya\n\nPage [16]\n\nThe transition to multicellularity\nProbably occurred in several steps:\n\u2022 Aggregation of cells into a cluster\n\u2022 Intercellular communication within the cluster\n\u2022 Specialisation of some cells within the cluster (cooperation)\n\u2022 Organisation of specialised cells into groups (tissues)\n\nTransition to multicellularity also\nresults in individual cells losing\nthe ability to live independently\n\nVolvocine green algae\nChlamydomonas\n\nPandorina\n\nEudorina\n\nPleodorina\n\nVolvox\n\nSingle-celled\n\n16-celled cluster\n\nLarger cluster of cells\n\nLarge cluster of cells\nwith somatic and\nreproductive cells\n\nEven larger cluster of cells\nwith somatic and reproductive\ncells organised into tissues\n\nSadava 11e Fig. 7.17\n\nPage [17]\n\nActivity 1 \u2013 Comparing", "Gas exchange in multicellular organisms": "Learning outcomes\nBy the end of this lecture, you will be able to explain how gas exchange\nstructures overcome the challenges of multicellularity.\nThis includes being able to:\n\u2022 Explain why the surface area to volume ratio and diffusion limits\nnecessitates gas exchange systems.\n\u2022 Explain features of exchange surfaces utilising Fick's law.\n\nPage [4]\n\nLet's check in\nWe talked about surface area to volume ratio and diffusion limits\nDiffusion limits apply to many necessary biological molecules\n\u2022 Here, we focus on gases\n\nPage [5]\n\nLet's recap: Diffusion limits\n\u2022 Many challenges associated with evolution from a small organism to being a larger\norganism\n\u2012 E.g. energy demands, communication and coordination of many cells, distribution of\nnutrients within the larger body\n\u2022 The surface area : volume problem\nLet\u2019s explore this problem by considering some different size objects.\n\nPage [6]\n\nActivity 1 \u2013 Diffusion limits\nObject 2\n\nCalculate the following for one dice and the milk carton:\n\u2022\n\u2022\n\u2022\n\u2022\n\nVolume\nSurface area\nSurface area : volume ratio\n(Surface area \u00f7 volume)\n\n21 cm\n\nObject 1\n\n1.6 cm\n\n7 cm\n7 cm\n\nPage [7]\n\nActivity 1 \u2013 Diffusion limits\n\nObject 1\n\nObject 2\n\nVol.\nSA.\nSA : V ratio (i.e. SA \u00f7 V)\n\n8\n\nActivity 1 \u2013 Diffusion limits\n\nPoll Everywhere\n\nComparing the SA:V ratio between these two objects:\n\u2022 The surface area:volume ratio is ____________ for\nthe dice than the milk carton.\n\u2022 As the object gets larger, the ratio gets ________.\nThen consider the impact this has on diffusion limits in a\nbiological context...\n\nPage [9]\n\nActivity 1 \u2013 Diffusion limits\n\n\u2022 When an organism is small, the surface area to\nvolume ratio is bigger than when then the\norganism is large.\n\u2022 In larger organisms, there is less area per\nvolume exposed to the external environment for\nexchange.\n\u2022 Consider also the time for diffusion to occur\nover greater distances in larger organisms.\n\nPage [10]\n\nMulticellular animals face limitations in exchange\nnutrients\n\nO2\n\nO2\n\nConstraint 1:\nSurface area to volume ratio of a\nmulticellular organism is small\n\nnutrients\n\nwaste\nCO2\nNot drawn to scale\nLarge surface area to volume ratio\n\nConstraint 2:\nDistance of internal cells to external\nenvironment is large\n\nCO2\n\nwaste\n\nSmall surface area to volume ratio\n\nOverall consequence:\nDiffusion with the external environment cannot meet the exchange needs of (most) multicellular organisms.\nPage [11]\n\nSome organisms use diffusion only\nCells in many multicellular aquatic organisms are close to the external environment.\nDiffusion occurs directly between the cells of the body and the external environment.\n\nFlatworm \u2013 flat\n\nHydra \u2013 hollow\n\nSponges \u2013 porous\n\nCentral cavity brings the external environment\ninto the animal\nPage [12]\n\nOther multicellular organisms\nUtilise three innovations to overcome these constraints:\n\u2022 Maintain an internal aqueous environment (Lectures 32-33)\n\u2022 Specialised transport systems (Lectures 30-31)\n\u2022 Specialised exchange surfaces (This lecture)\n\nPage [13]\n\nMulticellular organisms have an internal\nenvironment\nCells meet their exchange needs through exchange with an internal aqueous\nenvironment (extracellular fluid).\nA barrier is needed to create an internal environment.\nThe internal environment is kept stable by homeostasis.\nO2\n\nNutrients\n\nO2\n\nNutrients\n\nBarrier\n\nwaste\nCO2\nCO2\n\nwaste\n\nInternal environment\n\nL32 Communication between cells\nL33 Maintaining the cells in balance: Homeostasis\n\nRapid exchanges with the extracellular fluid\nPage [14]\n\nInternal environment, extracellular space\nECM\n", "Transport in animals": "Learning outcomes\nBy the end of this lecture, you will be able to explain how the transport needs\nof animals are met by circulatory systems.\nThis includes being able to:\n\u2022 Describe the transport needs of animals.\n\u2022 Compare and contrast open and closed circulatory systems.\n\u2022 Explain the origins, benefits and consequences of various circulatory\nsystems relative to environment.\n\u2022 Explain how blood pressure varies in the circulatory system and dictates\nthe flow of fluids in and out of capillaries.\nPage [4]\n\nLet's check in\n\nPrevious lectures worked through:\n\u2022 SA:V ratio and diffusion limits (constraints of multicellularity)\n\u2022 Specialised exchange surfaces solve part of this challenge\n\nPage [5]\n\nMulticellular animals face limitations in exchange\nnutrients\n\nO2\n\nO2\n\nConstraint 1:\nSurface area to volume ratio of a\nmulticellular organism is small\n\nnutrients\n\nwaste\nCO2\n\nNot drawn to scale\n\nLarge surface area to volume ratio\n\nConstraint 2:\nDistance of internal cells to external\nenvironment is large\n\nCO2\n\nwaste\n\nSmall surface area to volume ratio\n\nOverall consequence:\nDiffusion with the external environment cannot meet the exchange needs of (most) multicellular organisms.\nPage [6]\n\nA circulatory system solves the diffusion limit\ndiffusion\n\n\u2022 Movement of extracellular fluids\naround the body ensures exchanged\nsubstances from specialised\ntissues/organs reach cells of the\nbody (bulk flow).\n\u2022 Maintains high concentration\ngradients for diffusion.\n\nCO2\n\nO2\nCO2\n\nO2\n\nCO2\n\ndiffusion\nCO2\n\nO2\n\nEnsures optimal:\n\u2022 gaseous exchange, nutrient mobilisation\nbulk flow\n\n\u2022 waste removal, intercellular\ncommunication\nPage [7]\n\nMulticellular organisms require complex\ntransport systems**\nO2\n\nH2O\ncarbohydrates\netc\n\nCO2 H O\n2\n\nTo maintain a high level of metabolism large\nmulticellular organism:\n\u2022 Highly branched internal transport\nsystems\n\n\u2022 Rapid movement of exchange substances\nConsiderable force required to move fluids\nthrough these transport systems\n\nH2O and dissolved\nminerals\n\nActive vs passive processes\nSadava, 10e, Fig. 50.2\n\nCirculatory systems of animal involve\nactive mechanisms - pumps\n\nSadava, 10e, Fig. 35.1\n\nTransport systems of plants involve\npassive processes\nPage [8]\n\n*** There is an always an exception\n\nSome animals lack a circulatory\nsystem, why?\nTardigrades\n\nCnidarians\n(jellyfish, corals, hydra)\n\nFlatworms\n\nSponges\nPage [9]\n\nSo why do animals need transport systems?\n\u2022 Too large for direct diffusion to cells\n\u2022 Need some other mechanism to allow for these at the cellular level:\n\u25aa Gas exchange\n\u25aa Nutrient delivery\n\u25aa Waste removal\n\u25aa Communication and coordination of cells & tissues\n\nPage [10]\n\nTransport solution???\nVariation in circulatory systems\n\u2022 Need for efficient transport (high metabolic demand)\nvs.\n\u2022 Energy usage of the transport system\n\nPage [11]\n\nPhylogenetic perspective of the blood\nvascular system. Blood vascular\nsystem types and major propulsive\norgans are shown for representative\nextant phyla. The phylogenetic tree is\nschematic only, and the timelines are\nnot drawn to scale. EC, endothelial\ncell; mya, million years ago.\n\nMonahan\u2010Earley, R., Dvorak, A. M., & Aird, W. C. (2013).\nEvolutionary origins of the blood vascular system and\nendothelium. Journal of Thrombosis and Haemostasis, 11,\n46-66.\n\nPage [12]\n\nPhysiology of circulatory systems\nCommon components of circulatory\nsystems:\n\u2022 Pump\n\u2022 Circulatory fluid\n\u2022 Exchange surfaces\n\u2022 Systems of tubular vessels\n\u2022 Mechanisms to return fluid to pump\n\u2022 Elements to structure flow & direct\nfluid\nPage [13]\n\nTypes of", "Transport in plants": "Week 11, Lecture 31\nTransport in plants\nDr Mel Saligari\n\nConsequences of multicellularity\n\u2022 Generally, can no longer rely on direct diffusion\n\u2012 Oxygen and nutrients need to be moved to all cells\n\u2012 CO2 and waste products need to be moved out\nConstraint 1:\nSurface area to volume ratio of a\nmulticellular organism is small\n\nConstraint 2:\nDistance of internal cells to external\nenvironment is large\n\nL29 Gas exchange in multicellular organisms\nL30 Transport in animals\nL31 Transport in plants\nPage [3]\n\nLearning outcomes\nBy the end of this lecture, you will be able to explain how the transport\nneeds of plants are met by the vascular tissue.\nThis includes being able to:\n\u2022 Describe the transport needs of plants.\n\u2022 Explain the origins, benefits and consequences of vascular tissue\nincluding water and nutrient transport systems.\n\u2022 Compare and contrast active and passive transport processes in\nplants and the connections between them.\nPage [4]\n\nLet's check in\nPrior knowledge from earlier topics:\n\u2022 Osmosis involves selectively permeable membranes\n\u2022 Water potential determines the direction of water movement\n\u2022 Photosynthesis produces sugars\n\nPage [5]\n\nThe Ordovician landscape\n\nPage [6]\n\nPlants \u2013 A potted history\n450-500 mya\nGreen algae\n\nLand plants\n\n400 mya\nVascular plants\n\nChlorophytes\n\nLiverworts\n\nMosses\n\nLycophytes\n\nFerns\n\nGymnosperms\n\nAngiosperms\n\nPage [7]\n\nEvolution of vascular tissue\n\nTransport of water and\nnutrients\n\nRigid structural support\n\nTracheids in woody tissue\n\nCalifornia redwood \u2013\nHyperion \u2013 tallest living\norganism (115.9 m)\n\nGiant sequoias \u2013\nGeneral Sherman \u2013\nlargest living organism\nby volume\nPage [8]\n\nBasic transport needs of the plant\nH2O\nH2O\n\nH2O\n\nGeneral direction of flow\n\nPlants must obtain water and\nminerals from the soil via the roots\nWater is required for:\n\u2022 Photosynthesis in the leaves\n\u2022 Transporting solutes between plant\norgans\n\u2022 Cooling the plant\n\u2022 Structural support (turgor\npressure)\n\nShoot requires water\n\nH2O\n\nH2O\n\nRoots acquire water\nfrom the soil\n\nH2O\nH2O\nSadava 12e. Fig. 33.1\n\nH2O\n\nH2O\n\nWater\nPage [9]\n\nTransporting mineral nutrients\nNeed to transport mineral nutrients for the\nsynthesis of organic compounds required\nfor growth \u2013 macro and micronutrients\n\u2022 Nitrogen, Phosphorus \u2013 main\nmacronutrients\n\u2022 Iron \u2013 main micronutrient\n\nGeneral direction of flow\n\nShoot requires\nmicro/macronutrients\n\nN/Fe/P\nN\n\nP\n\nFe\n\nP\nSadava 12e. Fig. 34.1\n\nFe\n\nP\n\nN\n\nRoots accumulate\nmicro/macronutrien\nts from soil\n\nNutrients\nPage [10]\n\nTransporting sugars\nLight\n\nNon-photosynthetic tissue require\nsugars and other material from leaves\nCO2\n\u2022 sucrose\n\u2022 transported in the phloem as\nCO2\nphloem sap\nSource vs. sinks\n\nGeneral direction of flow\n\nCO2\n\n(although movement in phloem is\nbi-directional depending on\nsource/sink locations)\n\nPhotosynthetic tissue\nShoot is a net source\nof sugars\n\nsugars\n\nNon-photosynthetic\ntissue \u2013 Roots are a\nnet sink for sugars\n\nSugars\nSadava 12e. Fig. 33.1\n\nPage [11]\n\nPlants maintain temperature through transpiration\nPlants remain cool through latent heat loss as transpiration occurs\n\nPage [12]\n\nPlant structures are maintained by turgor pressure\nReduction in turgor pressure results in plant cells becoming less rigid \u2013 flaccid cells\nReduction in cellular support causes the plant to wilt\n\nLow turgor pressure \u2013\nflaccid cells\n\nSadava 12e. Fig. 33.3\n\nHigh turgor pressure \u2013\nturgid cells\nPage [13]\n\nWater movement is determined by water potential\nWater moves in and out of cells by osmosis \u2013 passive process\nThe direction of water movement is ", "Communication between cells": "Learning outcomes\nBy the end of this lecture, you will be able to describe mechanisms for cell-tocell communication in a complex multicellular organism (chemical & electrical).\nThis includes being able to:\n\u2022 Describe the different types of chemical signals between cells using\nexamples.\n\u2022 Discuss how action potentials are generated and propagated.\n\u2022 Compare and contrast chemical and electrical signalling between cells.\n\nPage [3]\n\nConsequences of multicellularity\n\u2022 Remember that key steps in transition to multicellularity involved:\n\u2012 Intercellular communication within the cluster\n\u2012 Specialisation of some cells within the cluster (cooperation)\n\u2022 It is imperative that all cells can be coordinated\n\u2022 This requires multiple levels and types of communication\nConstraint 3:\nNeed to coordinate the functions of\nall cells within the organism \u2013\nCoordination = dependency\n\nL32 Communication between cells\nL33 Maintaining the cells in balance: Homeostasis\nPage [4]\n\nCommunication between cells\n\nWhat other communication between\ncells is occurring in this situation?\nThink, pair, share with the students close by\nyou.\n\n6\n\nWhat other communication between cells is\noccurring in this situation?\n\u2022 Sensory receptors receiving the information\n\u2022 Information feed to CNS for central processing\n\u2022 Communication output to have coordinated movements and responses\n\u2022 Cells releasing glucose for muscle movement\n\u2022 Increased blood flow to the limbs > nutrient delivery & waste removal\n\u2022 Many muscles been contracted and relaxed in coordinated movement\n\nPage [7]\n\nCommunication & coordination\nHow can information be relayed between distant cells?\nChemical messages\n\nElectrical signals (animals)\n\nPage [8]\n\nLet's recap: Different chemical signals\n\u2022 Autocrine signals affect the cells that\nmade them\n\u2022 Juxtacrine signals affect only adjacent\ncells\n\n\u2022 Paracrine signals affect nearby cells\n\u2022 Hormones travel to distant cells, usually\nvia the circular system\n\n9\n\nCell signalling from a distance\n\nHormone\n\u201cA chemical signal produced in\nminute amounts at one site in a\nmulticellular organism and\ntransported to another site where\nit acts on target cells.\u201d\n\n10\n\nHormone groups\nProtein hormone\n\nSteroid hormone\n\nAmine hormone\n\nWater soluble\n\nLipid soluble\n\nWater soluble\n\nEasily transported in blood\n\nPass through membranes\n\nOR\n\nExocytosis\n\nCarrier molecules\n\nLipid soluble\nPage [11]\n\nDifferent hormone classes\nWater soluble\n\nBinding of water-soluble hormones\n\nby 3.0\nBinding of water-soluble hormones, by OpenStax College, CC\nCC\nby 3.0\n\nLipid soluble\n\nRegulation of gene expression by steroid hormone receptor\n\nRegulation of gene expression by steroid hormone receptor,\nby 4.0\nby Ali Zifan, CC\nCC\nby 4.0\nPage [12]\n\nIs epinephrine water or lipid soluble? Why?\n\nThink, pair, share with the students close by you.\n13\n\nEndocrine glands\nKey organs:\n\u2022 Neuroendocrine (hypothalamus/pituitary)\n\u2022 Thyroid\n\u2022 Pancreas\n\u2022 Adrenal\n\u2022 Pineal gland/photoreceptive cells\n\u2022 gonads\n\nVlachogianni et al 2013\n\nVlachogianni et al 2013\n\nAnatomy_and_physiology_of_animals_\n\nAnatomy_and_physiology_of_animals_\n\nMain_endocrine_organs_of_the_body\nMain_endocrine_organs_of_the_body,\nby 3.0\nby Ruth Lawson, CC\nCC\nby 3.0\n\nPage [14]\n\nHormones may have variable roles\n\u2022 Hormones may be present across multiple species but have different roles in those\nspecies\n\n\u2022 E.g. prolactin in vertebrates\n\nPage [15]\n\nNervous system\n\u2022 Neurons generate and transmit electrical signals\n\u2022 Use ion movement to change membrane potential = action potential\n\nSensory information", "Maintaining Cells in Balance: Homeostasis": "Learning outcomes\nBy the end of this lecture, you will be able to explain the concept of homeostasis\nand describe how feedback mechanisms regulate key physiological processes.\nThis includes being able to:\n\u2022 Describe how positive and negative feedback loops control key physiological\nprocesses.\n\u2022 Explain stimulus-response and negative feedback as a mechanism for\nmaintaining internal homeostasis.\n\u2022 Describe how cells communicate in plants with a focus on water homeostasis.\n\nPage [3]\n\nLet's check in\nPrevious lecture discussed the general nature of chemical and electrical\nsignalling\n\nPage [4]\n\nLet\u2019s recap: Chemical & electrical signalling\n\nAction potential\n\nPage [5]\n\nLet's check in\nPrevious lecture discussed the general nature of chemical and electrical\nsignalling\n\u2022 Why is signalling & communication so important?\n\nPage [6]\n\nHomeostasis\n\nHomeostasis: The maintenance of a steady state by means of\nphysiological or behavioural feedback responses\nWhy is it so important to maintain a stable internal environment in\nanimals?\n\nPage [7]\n\nKey concept\n\nIn a multicellular organism, cells depend on their\nimmediate environment, the extracellular fluid.\n\nMany factors must be maintained within\nphysiological range:\n\u2022 temperature\n\u2022 osmotic potential\n\u2022 pH\n\u2022 concentration of ions and nutrients\n\u2022 O2 and CO2 levels\n\nextracellular\nfluid\n\nPage [8]\n\nSo how are bodies maintained in balance?\nNegative feedback loops\n\nresponse\nEquilibrium\nstimulus\n\nSeesaw in action, by \u053c\u0565\u0576\u0561 \u054d\u0561\u0570\u0561\u056f\u0575\u0561\u0576, CC 4.0\n\nPage [9]\n\nStimulus-response model\nReceptor\n\nstimulus\n\nA receptor to detect a change away from the desired equilibrium value, and signal to a\ncontrol centre.\n\nPage [10]\n\nStimulus-response model\nReceptor\nControl centre\n\nstimulus\nEffector\nA receptor to detect a change away from the desired equilibrium value, and signal to a\ncontrol centre.\nA control centre that can receive and process this information and communicate to an\neffector.\n\nPage [11]\n\nStimulus-response model\nresponse\n\nControl centre\nEffector\nA receptor to detect a change away from the desired equilibrium value, and signal to a\ncontrol centre.\nA control centre that can receive and process this information and communicate to an\neffector.\nAn effector that creates a response that opposes the effect of the stimulus.\nPage [12]\n\nStimulus-response model\nReceptor\nControl centre\n\nCell-cell\ncommunication\n\nEffector\nA receptor to detect a change away from the desired equilibrium value, and signal to a\ncontrol centre.\nA control centre that can receive and process this information and communicate to an\neffector.\nAn effector that creates a response that opposes the effect of the stimulus.\nPage [13]\n\nExample: Blood glucose homeostasis\nBlood glucose levels in\nthe blood must be kept\nwithin 4-8 mmol/L\n\nLow blood sugar levels\n(hypoglycaemia) affects the\nnervous system causing:\n\u2022 seizures\n\u2022 loss of consciousness\n\nHigh levels (hyperglycaemia)\ncan damage cells leading to\nincreased risk of\n\u2022 heart disease\n\u2022 stroke\n\u2022 kidney disease\n\u2022 vision impairment\n\nNegative feedback loop: Blood glucose levels\nImportance: Maintain the preferred source for cellular energy in a ready\nsupply in the blood stream (4-8 mmol)\nConsequences: Ketoacidosis, impaired neural function, osmolar\nimbalance and injury, AGEs\n\nPage [15]\n\nNegative feedback loop: BGL\nBGL increase\nStimulus\n\nPancreas\nreleases insulin\n\nGlucose levels\ndrop in the blood\n\nRelease of\nchemical\nmessage\n\nCorrection\nof levels\n\nEffector\n\nTarget cells\nincrease glucose\nuptake\n\nPage [16]\n\nNegative feedback loop: BGL\nUt", "How Cells Develop Different Roles": "Learning outcomes\nBy the end of this lecture, you will be able to discuss and compare key\nregulatory mechanisms and stages of development in multicellular\nanimals and plants.\n\nThis includes being able to:\n\u2022 Compare and contrast development in animals and plants.\n\u2022 Describe embryonic development in plants and the subsequent role of\nmeristems in continuous development.\n\nPage [3]\n\nLet's check in\nPreviously discussed\n\u2022 Benefits & consequences of multicellularity\n\u2022 Cell specialisation\n\nThis lecture:\nHow do multicellular organisms' cell develop for specialisation?\n\nPage [4]\n\nThe Wonder of Development!\nAlpine newt\n\nKidney bean plant\n\nBECOMING \u2013 by Jan Van IJken\n\nThe embryonic development of the Alpine Newt\nFilmed, directed and produced by Jan van IJken\nAudiomix Huibert Boon\n\nWatch the full video here => https://www.youtube.com/watch?v=SEejivHRIbE\n\nWatch the full video here => https://www.youtube.com/watch?v=w77zPAtVTuI\n\nPage [5]\n\nOverview of embryogenesis\nEmbryogenesis \u2013 Formation of a multicellular organism from a zygote\n\nThe zygote undergoes multiple\nrounds of cell division producing\nspecific cell types in precise\npatterns along major spatial axes.\nOrganisation of cells is NOT\nRANDOM \u2013 cell types arranged\naccording to a body plan\n\nFertilised egg\n\nFertilised egg\n\nPage [6]\n\nCell fate establishment\n\u2022 Embryogenesis can be thought of as a tree of cell divisions\n\nzygote\nPage [7]\n\nCell fate establishment\n\u2022 Embryogenesis can be thought of as a tree of cell divisions\n\u2022 Establishment of cell fate (determination) arises during the early stages of embryogenesis\n\u2022 Cells become increasingly more restricted in their fate \u2013 change in cell potency\n\nzygote\n\nDetermination\nCells begin to express different genes\nPage [8]\n\nCell fate establishment\n\u2022\n\u2022\n\u2022\n\u2022\n\nEmbryogenesis can be thought of as a tree of cell divisions\nEstablishment of cell fate (determination) arises during the early stages of embryogenesis\nCells become increasingly more restricted in their fate \u2013 change in cell potency\nPattern of cell fate is highly ordered and reflects the position of cells in the developing embryo\n\u2013 instructive cues (cytoplasmic factors/cell signalling molecules)\nInstructive information\n\nzygote\n\nDetermination\nCells begin to express different genes\n\nHighly ordered pattern of cell\nfate established\nPage [9]\n\nMorphogenesis \u2013 Sculpting the body\nMorphogenesis \u2013 process by which cells and tissues organise and arrange\nthemselves to create the final form of the body.\n\u2022 Division\n\u2022 Changing shape (expansion)\n\u2022 Moving (not seen in plant\nembryogenesis)\n\u2022 Adhering to one another (not seen\nin plant embryogenesis)\n\u2022 Death (apoptosis)\nExample of morphogenesis in\nthe sea urchin\n\nExample of plant\nembryogenesis\n(Arabidopsis)\nPage [10]\n\nDifferentiation\nThe final body is comprised of many types of specialised cells, which come together\ninto coherent tissues, and organs that make up the functioning organism.\nEpidermal cells\nMuscular\nFoot tube cells\n\nMesophyll\ncells\n\nsea star\n\nArabidopsis\n\nPigmented\neyespot cells\nPage [11]\n\nMulticellular organisms have many cell types\n\nepidermal\ncells\n\nPalisade\nmesophyll\ncell\n\nSieve tube\nelements\nGuard cell\nWikipedia\n\nVessel\nelements\n\nPage [12]\n\nHow does one genome produce many cell types?\nSo all these cells have\nthe same genome.\nDNA is replicated at\nevery cell division\n\nenterocytes\n\nenterocyte\n\nintestine\n\nHow then do we get all\nthe specialised cell\ntypes of the body?\nPage [13]\n\nHow does one genome produce many cell types?\n\nenterocyte\n\nintestine\n\nCells begin to take on\nd", "Animal development: From meiosis to adult": "Learning outcomes\nBy the end of this lecture, you will be able to explain the key stages of\nembryonic development from fertilisation to organogenesis.\nThis includes being able to:\n\u2022 Understand the key regulatory mechanisms and stages of animal\ndevelopment.\n\u2022 Understand the unidirectional nature of cell specialisation.\n\u2022 Describe how a fertilised egg develops into an adult body and the role\nof stem cells in ongoing maintenance of that body.\nPage [3]\n\nLet\u2019s recap\n\nPreviously\n\u2022 Compared and contrasted animal and plant development\nNow to understand some of the key stages of animal development\n\nPage [4]\n\nCells differ in their potency \u2013 Recap\nTotipotent \u2013 potential to produce all cell types of an organism (e.g. zygote)\nPluripotent \u2013 can produce all the cell types of the body but not cells of\nextraembryonic tissue like the placenta (e.g. embryonic stem cells, and induced\npluripotent stem cells)\nMultipotent \u2013 can produce several cell types (e.g. stem cells)\nUnipotent \u2013 can produce only one cell type \u2013 i.e. cells that can only produce\ndaughter cells of the same type (e.g. skin cells)\n\nPage [5]\n\nPotency\n\nCell potency vs. differentiation\n\nDifferentiation\n\nKey stages of animal development\ngastrulation\ncleavage\n\nfertilisation\n\ngastrula\n\nblastula\n\norganogenesis\n\nzygote\n\nXenopus laevis\n(African Clawed Frog)\n\nmetamorphosis\nWolpert 6e, Fig 3.3\n\nTadpole\nPage [7]\n\nCleavage\n\ncleavage\nblastula\n\n\u2022 Rapid divisions of the zygote into smaller cells\n\u2022 Cleavage divisions have no growth (i.e. G1/G2 phases)\n\u2022 Results in a simple arrangement of cells surrounding a\nfluid filled cavity\n\nzygote\nWolpert 6e, Fig\n3.3\n\nPage [8]\n\ngastrulation\n\nGastrulation\nThe process by which a blastula is transformed by\nmassive movement of cells into a gastrula (an embryo\nwith 3 germ layers & distinct body axes)\n\ngastrula\nblastula\n\nDorsal\nAnterior\n\n\u2022 Establishes a complex multi-layered embryo\n\u2022 Sets up the main body axes\n\u2022 Creates the three germ layers\n\nPosterior\nVentral\n\nSada va 11 e F ig . 30 .5\n\nLeft\n\nectoderm\n\nAnterior\n\nmesoderm\n\n\u2022 Gastrulation can look quite different between\nspecies, but the principles remain the same\n\nendoderm\nVentral\n\nDorsal\n\nLeft\nPosterior\nPage [9]\n\nGerm layers\n\u2022 Ectoderm\nectoderm\n\u2022 Ecto \u2013 out of > outer\n\u2022 Mesoderm\nmesoderm\n\u2022 Meso \u2013 middle\n\u2022 Endoderm\n\u2022 Endo \u2013 within, inner or inside\n\nendoderm\n\nQuestion\nAre cells within these germ\nlayers totipotent, pluripotent,\nmultipotent or unipotent?\nPage [10]\n\nGastrulation and the establishment of the\ngerm layers\n\u2022 Establishment of three distinct cell\nidentities (germ layers) occurs early\nduring embryogenesis \u2013 determination\nFlattening\n\n\u2022 Cells at the base of the blastula begin to\nchange shape\nectoderm\nmesoderm\nendoderm\nSadava 12e Fig. 42.7\n\nPage [11]\n\nGastrulation and the establishment of the\ngerm layers\n\nCells (red) separate from\nthe outer layer and move\ninwards\n\nInward bulge formed by\ncells (yellow) changing\nshape\n\nectoderm\nmesoderm\nendoderm\nSadava 12e Fig. 42.7\n\nPage [12]\n\nGastrulation and the establishment of the\ngerm layers\nFurther cell migration and attachment\nto the tip of the invagination\nCell change shape and\nundergo rearrangements\n\nInvagination extends into\na long thin tube\n\n\u2022 Cells in the invagination form the endoderm layer (yellow)\n\u2022 Endodermal cells extend, flatten and undergo rearrangement\nto form a long thin tube - the gut\nSadava 12e Fig. 42.7\n\nectoderm\nmesoderm\nendoderm\nPage [13]\n\nGastrulation and the establishment of the\ngerm layers\n\nGastrula\n\nanus\n\n\u2022 Gastrula is formed\n\u2022 Future sites for the mouth and anus", "Cells to multicellularity: How it all works": "Learning outcomes\nBy the end of this lecture, you will be able to describe multicellular\norganisms as a hierarchy of specialised cell types comprising distinct\ntissues and coordinating to form functional organs.\n\nThis includes being able to:\n\u2022 Compare and contrast the four different tissues found in animals and\nexplain how different tissue types combine to form a functional organ.\n\u2022 Compare and contrast the three tissue types found in flowering plants\nand describe how these are integrated into a functioning leaf.\nPage [3]\n\nLet's check in\nIn the previous lectures:\nAnimal cells > differentiate into 3 germ layer types > tissues\nPlant cells > differentiate into 3 primary meristem types > tissues\n\nPage [4]\n\nGerm layers give rise to distinct cells and\ntissue types\nEctoderm\nskin\n\nnervous system\n\nBlood\nvessels\n\nMesoderm\nmuscles\n\nhuman embryo at gastrulation\n\nconnective tissue\n\nEndoderm\nLining of gut, lung etc.\nPage [5]\n\nTissues\n\u2022 Common embryonic origin\n\u2022 Structurally similar cells > functional units\n\n\u2022 Four broad categories\n\u25aa Epithelial\n\u25aa Connective\n\u25aa Muscle\n\u25aa Nervous\nPage [6]\n\nEpithelial: structure\n\nfunction\n\nBased on the structure what do you think might be the function?\n\u2022 Squamous = flat shape\n\u2022 Columnar = tall narrow cells\n\u2022 Cuboidal = Cube like appearance\n\u2022 Simple = single layer\n\u2022 Stratified = multiple layers\n\u2022 Pseudostratified = appearance of multiple layers, but actually a single layer\n(variety of sizes)\nPage [7]\n\nEpithelial\n\ncolumnar\nStratified squamous\n\ncuboidal\n\nSecretory cells\n\nPage [8]\n\nConnective: Structure\n\nfunction\n\nVariety of connective cells and functions\nWhat kind of structure is required to support these functions?\n\u2022Transporting molecules around the body\n\u2022Cushioning/protection and energy storage\n\u2022Structural support and strength\n\u2022Mechanical strength and flexibility\n\nPage [9]\n\nConnective\n\nBones\n\nAdipose tissue\n\nBlood cells\n\nLigaments and tendons\nPage [10]\n\nMuscle: Structure\n\nfunction\n\nMuscle properties include excitability, contractility, extensibility, elasticity.\nHow does each of these muscle types exhibit those properties?\n\u2022 Cardiac muscle\n\u2022 Smooth muscle\n\u2022 Skeletal muscle\n\nPage [11]\n\nMuscle\n\nCardiac\n\nSkeletal\n\nSmooth\n\nPage [12]\n\nStructure of skeletal muscle\nMuscle is composed of bundles of muscle\nfibres (cells)\nMuscle fibre \u2013 multinucleate cell with many\nmyofibrils\nMyofibrils composed of highly ordered\narrangements of myosin (thick) and actin\n(thin) filaments \u2013 striated appearance\n\nSadava 12e Fig. 46.1\n\nPage [13]\n\nMuscle contraction is driven by Myosin: an ATPdependent motor protein\nMuscle\nrelaxed\n\nSliding actin filaments\n\nMuscle\ncontracted\nSadava 12e Fig. 46.1\n\nMuscle contraction is caused by an ATP-dependent motor protein comprised of myosin\nfilaments pulling on actin filaments\n\nContraction is activated by electrical signals\nPage [14]\n\nNervous tissue\nIncludes:\n\u2022 neurons\n\u2022 support cells (e.g. glial cells)\n\u2022 sensory receptor cells\n\nPage [15]\n\nNervous tissue \u2013 processing information\n\u2022 gather information about the\nexternal and internal environment\n\u2022 process information\n\u2022 control physiology and behaviour\nof the body\n\nNeurons transmit electrical\nsignals called action potentials\n\nKnox \u2013 Fig 7.11\n\nGlial cells provide mechanical and\nnutritional support for neurons\nDO NOT generate action potentials e.g.\nSchwann cell\nPage [16]\n\nOrgans are composed of multiple tissue types\nNetwork of nervous tissue\n\u2022\n\ncontrol and coordinate\ncontractions of smooth muscle\n\n\u2022\n\nprovide sensory function\n\nDiagram of the small intestine\n\nEpithelial tissue\n"}};

    document.getElementById('chat-wrap').style.display='flex';
    if(chatHist.length===0)initChat();
  } else {
    document.getElementById('content').style.display='block';
    document.getElementById('chat-wrap').style.display='none';
    if(mode==='notes')doNotes();
    else if(mode==='flashcards')doFC();
    else if(mode==='quiz')doQuiz();
    else if(mode==='exam')doExam();
  }
}

function renderHome(){
  document.getElementById('content').style.display='block';
  document.getElementById('chat-wrap').style.display='none';
  const total=Object.values(LD).reduce((a,b)=>a+Object.keys(b).length,0);
  document.getElementById('content').innerHTML=`
    <div class="wt">Ready to ace your <em>Biology</em> exam?</div>
    <div class="ws">Built from your actual lecture slides — all ${total} lectures.</div>
    <div class="stats">
      <div class="chip"><strong>${total}</strong><span>Lectures</span></div>
      <div class="chip"><strong>4</strong><span>Modules</span></div>
      <div class="chip"><strong>${Object.keys(cache).length}</strong><span>Cached</span></div>
    </div>
    <div class="hg">
      <div class="hc" onclick="setMode('notes')"><div class="ic">📄</div><h3>Notes</h3><p>AI summaries with memory tricks — cached after first load.</p></div>
      <div class="hc" onclick="setMode('flashcards')"><div class="ic">🃏</div><h3>Flashcards</h3><p>Tap-to-reveal Q&A cards from your slides.</p></div>
      <div class="hc" onclick="setMode('quiz')"><div class="ic">❓</div><h3>Quiz</h3><p>Multiple choice with instant feedback.</p></div>
      <div class="hc" onclick="setMode('chat')"><div class="ic">💬</div><h3>Ask AI</h3><p>Chat with a tutor who knows your slides.</p></div>
    </div>
    <div style="margin-top:11px;max-width:290px">
      <div class="hc" onclick="setMode('exam')"><div class="ic">📝</div><h3>Practice Exam</h3><p>Timed 10-question exam with scoring.</p></div>
    </div>
    <div style="margin-top:14px;font-size:11px;color:var(--dim);font-family:'DM Mono',monospace">💡 Results are cached — revisiting a lecture is instant.</div>`;
}

// skeleton loader helper
function skeleton(title){
  return`<div class="skel">
    <div class="skel-title"></div>
    <div class="skel-line w90"></div><div class="skel-line w80"></div><div class="skel-line w70"></div>
    <div class="skel-line w90"></div><div class="skel-line w50"></div>
    <div class="skel-line w80"></div><div class="skel-line w30"></div>
    <p class="loading-msg">⏳ Generating ${title}…</p>
  </div>
  <div class="skel" style="opacity:.6">
    <div class="skel-title"></div>
    <div class="skel-line w70"></div><div class="skel-line w90"></div><div class="skel-line w60"></div>
  </div>`;
}

async function api(sys,user,max=1200){
  const r=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:max,system:sys,messages:[{role:'user',content:user}]})
  });
  const d=await r.json();
  if(d.error) throw new Error(d.error.message);
  return d.content?.[0]?.text||'';
}

function getLec(){return LD[curMod]?.[curLec]||'';}

// ── NOTES ─────────────────────────────────────────────────────────────
async function doNotes(force=false){
  const k='n__'+curLec;
  const c=document.getElementById('content');
  if(!force&&cache[k]){showNotes(cache[k],true);return;}
  c.innerHTML=skeleton('notes');
  const sys=`Biology tutor. Generate exam-prep notes as clean HTML only — no backticks, no markdown.
Use: <h3> headings, <ul><li> bullets, <strong> key terms.
For memory tricks: <div class="mem"><div class="ml">🧠 MEMORY TRICK</div><p>…</p></div>
For exam tips: <div class="ew"><div class="el">🎯 EXAM WATCH</div><p>…</p></div>
Be concise and exam-focused.`;
  const lec=getLec();
  try{
    const html=await api(sys,`Notes for: "${curLec}"\n\nSlides:\n${lec.slice(0,2600)}\n\nInclude: summary, key concepts, memory tricks, exam watch, quick facts.`,1300);
    cache[k]=html;markDot(curLec);showNotes(html,false);
  }catch(e){c.innerHTML=`<div class="skel"><p style="color:var(--accent3)">Error: ${e.message}</p><br><button class="gb" onclick="doNotes(true)">↺ Retry</button></div>`;}
}

function showNotes(html,cached){
  document.getElementById('content').innerHTML=`
    <div style="display:flex;align-items:center;gap:7px;margin-bottom:13px">
      <span style="font-size:11px;color:var(--dim);font-family:'DM Mono',monospace">${curLec}</span>
      ${cached?'<span class="cb">⚡ cached</span>':''}
      <button class="rb" onclick="doNotes(true)">↺ regenerate</button>
    </div>
    <div class="nw">${html}</div>`;
}

// ── FLASHCARDS ────────────────────────────────────────────────────────
async function doFC(force=false){
  const k='f__'+curLec;
  const c=document.getElementById('content');
  if(!force&&cache[k]){showFC(cache[k],true);return;}
  c.innerHTML=skeleton('flashcards');
  const sys='Return ONLY a valid JSON array. No markdown, no backticks. Each item: {"q":"question","a":"answer"}';
  const lec=getLec();
  try{
    const raw=await api(sys,`12 flashcards for: "${curLec}"\nContent: ${lec.slice(0,2300)}\nMix: definitions, mechanisms, comparisons, applications.`,1100);
    const cards=JSON.parse(raw.replace(/```json|```/g,'').trim());
    cache[k]=cards;markDot(curLec);showFC(cards,false);
  }catch(e){c.innerHTML=`<div class="skel"><p style="color:var(--accent3)">Error. <button class="gb" onclick="doFC(true)">↺ Retry</button></p></div>`;}
}

function showFC(cards,cached){
  let h=`<div style="display:flex;align-items:center;gap:7px;margin-bottom:13px">
    <span style="font-size:11px;color:var(--dim);font-family:'DM Mono',monospace">${cards.length} cards · tap to reveal</span>
    ${cached?'<span class="cb">⚡ cached</span>':''}
    <button class="rb" onclick="doFC(true)">↺ new cards</button>
  </div><div class="fc-grid">`;
  cards.forEach(c=>{h+=`<div class="fc" onclick="this.classList.toggle('open')"><div class="fq">${c.q}</div><div class="fa">${c.a}</div><div class="fh">tap to reveal</div></div>`;});
  h+='</div>';
  document.getElementById('content').innerHTML=h;
}

// ── QUIZ ──────────────────────────────────────────────────────────────
async function doQuiz(force=false){
  const k='q__'+curLec;
  const c=document.getElementById('content');
  if(!force&&cache[k]){showQuiz(cache[k],true);return;}
  c.innerHTML=skeleton('quiz questions');
  const sys='Return ONLY valid JSON array. No markdown. Each: {"q":"question","opts":["A","B","C","D"],"ans":0,"exp":"explanation"}';
  const lec=getLec();
  try{
    const raw=await api(sys,`6 MCQ questions for: "${curLec}"\nContent: ${lec.slice(0,2300)}\nMix recall + application. Plausible distractors.`,1000);
    const qs=JSON.parse(raw.replace(/```json|```/g,'').trim());
    cache[k]=qs;markDot(curLec);showQuiz(qs,false);
  }catch(e){c.innerHTML=`<div class="skel"><p style="color:var(--accent3)">Error. <button class="gb" onclick="doQuiz(true)">↺ Retry</button></p></div>`;}
}

function showQuiz(qs,cached){
  let h=`<div style="display:flex;align-items:center;gap:7px;margin-bottom:13px">
    <span style="font-size:11px;color:var(--dim);font-family:'DM Mono',monospace">${qs.length} questions</span>
    ${cached?'<span class="cb">⚡ cached</span>':''}
    <button class="rb" onclick="doQuiz(true)">↺ new quiz</button>
  </div>`;
  qs.forEach((q,i)=>{
    h+=`<div class="qq"><span class="qn">Q${i+1}</span><div class="qt">${q.q}</div>`;
    q.opts.forEach((o,j)=>{h+=`<button class="qo" id="qo${i}_${j}" onclick="ans(${i},${j},${q.ans})">${String.fromCharCode(65+j)}. ${o}</button>`;});
    h+=`<div class="qe" id="qe${i}">${q.exp}</div></div>`;
  });
  document.getElementById('content').innerHTML=h;
}

function ans(qi,chosen,correct){
  document.querySelectorAll(`[id^="qo${qi}_"]`).forEach((b,i)=>{b.disabled=true;if(i===correct)b.classList.add('ok');else if(i===chosen)b.classList.add('no');});
  document.getElementById('qe'+qi).classList.add('show');
}

// ── EXAM ──────────────────────────────────────────────────────────────
async function doExam(){
  const c=document.getElementById('content');
  c.innerHTML=skeleton('exam questions (10)');
  const sys='Return ONLY valid JSON array of 10 objects. No markdown. Each: {"q":"question","opts":["A","B","C","D"],"ans":0,"exp":"explanation"}';
  const lec=getLec();
  try{
    const raw=await api(sys,`10-question exam for: "${curLec}"\nContent: ${lec.slice(0,2300)}\n3 easy, 4 medium, 3 hard.`,1400);
    const qs=JSON.parse(raw.replace(/```json|```/g,'').trim());
    startExam(qs);
  }catch(e){c.innerHTML=`<div class="skel"><p style="color:var(--accent3)">Error. <button class="gb" onclick="doExam()">↺ Retry</button></p></div>`;}
}

function startExam(qs){
  examState={qs,answers:{},start:Date.now(),limit:600};
  const c=document.getElementById('content');
  let h=`<div class="eh"><h2>📝 ${curLec}</h2><div class="etimer" id="etmr">⏱ 10:00</div><div style="font-size:11px;color:var(--muted);margin-top:3px">10 questions · select all before submitting</div></div>`;
  qs.forEach((q,i)=>{
    h+=`<div class="qq"><span class="qn">Q${i+1} of 10</span><div class="qt">${q.q}</div>`;
    q.opts.forEach((o,j)=>{h+=`<button class="qo" id="eq${i}_${j}" onclick="eAns(${i},${j})">${String.fromCharCode(65+j)}. ${o}</button>`;});
    h+='</div>';
  });
  h+=`<div style="text-align:center;padding:13px 0"><button class="gb" onclick="submitExam()" style="background:var(--accent);color:#0d1117;font-weight:600;border-color:var(--accent)">Submit Exam</button></div>`;
  c.innerHTML=h;
  stopTmr();
  examTmr=setInterval(()=>{
    if(!examState)return;
    const rem=examState.limit-Math.floor((Date.now()-examState.start)/1000);
    const el=document.getElementById('etmr');
    if(!el)return;
    if(rem<=0){stopTmr();submitExam();return;}
    el.textContent=`⏱ ${String(Math.floor(rem/60)).padStart(2,'0')}:${String(rem%60).padStart(2,'0')}`;
  },1000);
}

function eAns(qi,oi){
  examState.answers[qi]=oi;
  document.querySelectorAll(`[id^="eq${qi}_"]`).forEach(b=>{b.style.borderColor='';b.style.color='';});
  const b=document.getElementById(`eq${qi}_${oi}`);
  b.style.borderColor='var(--accent4)';b.style.color='var(--accent4)';
}

function stopTmr(){if(examTmr){clearInterval(examTmr);examTmr=null;}}

function submitExam(){
  stopTmr();if(!examState)return;
  const elapsed=Math.floor((Date.now()-examState.start)/1000);
  const score=examState.qs.filter((q,i)=>examState.answers[i]===q.ans).length;
  const pct=Math.round(score/10*100);
  const grade=pct>=80?'🏆 Excellent!':pct>=60?'👍 Good effort':pct>=40?'📚 Keep studying':'💪 More revision needed';
  const c=document.getElementById('content');
  let h=`<div class="eh"><h2>Results</h2><div class="escore">${score}/10 (${pct}%)</div><div style="font-size:12.5px;color:var(--muted);margin-top:3px">${grade} · ${Math.floor(elapsed/60)}m ${elapsed%60}s</div></div>`;
  examState.qs.forEach((q,i)=>{
    const right=examState.answers[i]===q.ans;
    h+=`<div class="qq"><span class="qn" style="color:${right?'var(--accent2)':'var(--accent3)'}">${right?'✓':'✗'} Q${i+1}</span><div class="qt">${q.q}</div>`;
    q.opts.forEach((o,j)=>{
      let cls=j===q.ans?'ok':(j===examState.answers[i]&&!right)?'no':'';
      h+=`<button class="qo ${cls}" disabled>${String.fromCharCode(65+j)}. ${o}</button>`;
    });
    h+=`<div class="qe show">${q.exp}</div></div>`;
  });
  h+=`<div style="text-align:center;padding:13px 0"><button class="gb" onclick="doExam()">🔄 Try Again</button></div>`;
  c.innerHTML=h;examState=null;
}

// ── CHAT ──────────────────────────────────────────────────────────────
function initChat(){
  document.getElementById('chat-area').innerHTML=`<div class="msg a">Hi! I'm your tutor for <strong style="color:var(--accent)">${curLec}</strong>. I've read your slides — ask me anything!</div>`;
}

async function sendChat(){
  const inp=document.getElementById('ci');
  const msg=inp.value.trim();if(!msg)return;
  inp.value='';
  const area=document.getElementById('chat-area');
  area.innerHTML+=`<div class="msg u">${msg}</div>`;
  const tid='t'+Date.now();
  area.innerHTML+=`<div class="msg a" id="${tid}"><div class="dots"><span></span><span></span><span></span></div></div>`;
  area.scrollTop=area.scrollHeight;
  document.getElementById('sb2').disabled=true;
  chatHist.push({role:'user',content:msg});
  try{
    const reply=await api(`Biology tutor. Topic: "${curLec}". Slides:\n${getLec().slice(0,2200)}\nBe concise, exam-focused.`,
      chatHist.map(m=>m.content).join('\n\nStudent: ').replace(/^/,'Student: '),900);
    // Actually use full messages format
    const r2=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:900,
        system:`Biology tutor. Topic: "${curLec}". Lecture slides:\n${getLec().slice(0,2200)}\nBe concise, exam-focused.`,
        messages:chatHist})
    });
    const d=await r2.json();
    const rep=d.content?.[0]?.text||'Sorry, no response.';
    chatHist.push({role:'assistant',content:rep});
    const el=document.getElementById(tid);
    if(el)el.innerHTML=rep.replace(/\n/g,'<br>');
  }catch(e){
    const el=document.getElementById(tid);
    if(el)el.innerHTML=`<span style="color:var(--accent3)">Error. Please try again.</span>`;
  }
  document.getElementById('sb2').disabled=false;
  area.scrollTop=area.scrollHeight;
}

function hk(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat();}}

buildSB();renderHome();
</script>
