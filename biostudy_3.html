<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BioStudy – Exam Prep</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0d1117;--surface:#161b22;--surface2:#1f2937;--border:#30363d;
    --accent:#58a6ff;--accent2:#3fb950;--accent3:#f78166;--accent4:#d2a8ff;
    --text:#e6edf3;--muted:#8b949e;--dim:#484f58;
    --m1:#58a6ff;--m2:#3fb950;--m3:#d2a8ff;--m4:#ffa657;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}
  #app{display:flex;height:100vh;overflow:hidden}
  #sidebar{width:265px;min-width:265px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
  #main{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .sb-head{padding:16px 14px 10px;border-bottom:1px solid var(--border)}
  .sb-logo{font-family:'DM Serif Display',serif;font-size:20px;color:var(--accent)}
  .sb-sub{font-size:10px;color:var(--muted);margin-top:1px;font-family:'DM Mono',monospace}
  .sb-nav{flex:1;overflow-y:auto;padding:6px 0}
  .sb-nav::-webkit-scrollbar{width:3px}
  .sb-nav::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
  .mod-lbl{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:1px;padding:10px 12px 3px}
  .m1{color:var(--m1)}.m2{color:var(--m2)}.m3{color:var(--m3)}.m4{color:var(--m4)}
  .lb{display:block;width:100%;text-align:left;background:none;border:none;color:var(--muted);padding:5px 12px;font-size:12.5px;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all .1s;border-left:2px solid transparent;line-height:1.4}
  .lb:hover{color:var(--text);background:var(--surface2)}
  .lb.active{color:var(--text);background:var(--surface2);border-left-color:var(--accent)}
  .lb .dot{display:inline-block;width:5px;height:5px;background:var(--accent2);border-radius:50%;margin-left:4px;vertical-align:middle}

  #topbar{display:flex;align-items:center;gap:6px;padding:9px 16px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;flex-wrap:wrap}
  .mb{padding:5px 12px;border-radius:5px;border:1px solid var(--border);background:none;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:12.5px;cursor:pointer;transition:all .1s}
  .mb:hover{border-color:var(--accent);color:var(--accent)}
  .mb.active{background:var(--accent);border-color:var(--accent);color:#0d1117;font-weight:600}
  .topic-title{font-family:'DM Serif Display',serif;font-size:14px;color:var(--text);margin-left:auto;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  #content{flex:1;overflow-y:auto;padding:18px}
  #content::-webkit-scrollbar{width:4px}
  #content::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

  /* SKELETON LOADER */
  .skel{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:20px;margin-bottom:14px}
  .skel-line{height:10px;background:var(--surface2);border-radius:4px;margin-bottom:8px;animation:shimmer 1.4s infinite}
  .skel-line.w90{width:90%}.skel-line.w70{width:70%}.skel-line.w80{width:80%}.skel-line.w50{width:50%}.skel-line.w30{width:30%}
  .skel-title{height:16px;width:55%;background:var(--surface2);border-radius:4px;margin-bottom:14px;animation:shimmer 1.4s infinite}
  @keyframes shimmer{0%,100%{opacity:.4}50%{opacity:.8}}
  .loading-msg{font-size:12px;color:var(--muted);font-family:'DM Mono',monospace;margin-top:10px}

  /* NOTES */
  .nw h3{color:var(--text);font-size:14px;margin:14px 0 5px}
  .nw ul{padding-left:16px;margin-bottom:8px}
  .nw li{font-size:13px;line-height:1.65;color:var(--muted);margin-bottom:3px}
  .nw strong{color:var(--accent)}
  .nw p{font-size:13px;line-height:1.65;color:var(--muted);margin-bottom:6px}
  .mem{background:rgba(63,185,80,.08);border:1px solid rgba(63,185,80,.2);border-radius:7px;padding:10px 13px;margin:10px 0}
  .mem .ml{font-size:9.5px;color:var(--accent2);font-family:'DM Mono',monospace;font-weight:600;margin-bottom:4px}
  .ew{background:rgba(88,166,255,.07);border:1px solid rgba(88,166,255,.2);border-radius:7px;padding:10px 13px;margin:10px 0}
  .ew .el{font-size:9.5px;color:var(--accent);font-family:'DM Mono',monospace;font-weight:600;margin-bottom:4px}

  /* FC */
  .fc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:11px}
  .fc{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px;cursor:pointer;min-height:105px;display:flex;flex-direction:column;justify-content:space-between;transition:border-color .12s}
  .fc:hover{border-color:var(--accent)}
  .fc .fq{font-size:13px;color:var(--text);line-height:1.5}
  .fc .fa{font-size:12.5px;color:var(--accent2);margin-top:8px;padding-top:8px;border-top:1px solid var(--border);display:none;line-height:1.5}
  .fc.open .fa{display:block}
  .fc .fh{font-size:9.5px;color:var(--dim);margin-top:5px;font-family:'DM Mono',monospace}
  .fc.open .fh{display:none}

  /* QUIZ */
  .qq{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:12px}
  .qt{font-size:13.5px;color:var(--text);margin-bottom:11px;line-height:1.5}
  .qn{font-size:10px;color:var(--dim);font-family:'DM Mono',monospace;display:block;margin-bottom:4px}
  .qo{display:block;width:100%;text-align:left;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:8px 12px;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;margin-bottom:6px;transition:all .1s}
  .qo:hover:not(:disabled){border-color:var(--accent);color:var(--text)}
  .qo.ok{border-color:var(--accent2);background:rgba(63,185,80,.09);color:var(--accent2)}
  .qo.no{border-color:var(--accent3);background:rgba(247,129,102,.09);color:var(--accent3)}
  .qe{font-size:12.5px;color:var(--muted);margin-top:7px;padding:8px 12px;background:var(--surface2);border-radius:5px;display:none;line-height:1.6}
  .qe.show{display:block}

  /* CHAT */
  #chat-area{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
  #chat-area::-webkit-scrollbar{width:4px}
  #chat-area::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
  #chat-row{padding:10px 16px;border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0}
  #ci{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:9px 12px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13.5px;resize:none;min-height:40px;max-height:100px}
  #ci:focus{outline:none;border-color:var(--accent)}
  #sb2{background:var(--accent);border:none;border-radius:7px;padding:9px 15px;color:#0d1117;font-weight:600;font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer}
  #sb2:disabled{opacity:.5;cursor:not-allowed}
  .msg{max-width:680px;font-size:13.5px;line-height:1.6}
  .msg.u{align-self:flex-end;background:var(--accent);color:#0d1117;border-radius:11px 11px 2px 11px;padding:8px 13px}
  .msg.a{align-self:flex-start;background:var(--surface2);border:1px solid var(--border);border-radius:2px 11px 11px 11px;padding:10px 14px}
  .dots{display:flex;gap:4px;align-items:center}
  .dots span{width:5px;height:5px;background:var(--muted);border-radius:50%;animation:bop 1.2s infinite}
  .dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
  @keyframes bop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}

  /* EXAM */
  .eh{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:16px}
  .eh h2{font-family:'DM Serif Display',serif;font-size:18px;color:var(--accent)}
  .etimer{font-family:'DM Mono',monospace;font-size:21px;color:var(--accent3);margin-top:4px}
  .escore{font-size:28px;font-family:'DM Serif Display',serif;color:var(--accent2)}

  /* HOME */
  .hg{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;max-width:580px}
  .hc{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px;cursor:pointer;transition:all .1s}
  .hc:hover{border-color:var(--accent);transform:translateY(-1px)}
  .hc h3{font-family:'DM Serif Display',serif;font-size:14.5px;margin-bottom:4px}
  .hc p{font-size:12px;color:var(--muted);line-height:1.5}
  .hc .ic{font-size:20px;margin-bottom:7px}
  .stats{display:flex;gap:9px;margin-bottom:18px;flex-wrap:wrap}
  .chip{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:8px 13px}
  .chip strong{color:var(--accent);display:block;font-size:18px;font-family:'DM Mono',monospace}
  .chip span{color:var(--muted);font-size:10px}
  .wt{font-family:'DM Serif Display',serif;font-size:24px;color:var(--text);margin-bottom:5px}
  .wt em{color:var(--accent);font-style:italic}
  .ws{font-size:13px;color:var(--muted);margin-bottom:18px}

  .cb{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-family:'DM Mono',monospace;color:var(--accent2);background:rgba(63,185,80,.1);border:1px solid rgba(63,185,80,.2);border-radius:3px;padding:2px 6px}
  .rb{font-size:10.5px;color:var(--dim);background:none;border:none;cursor:pointer;font-family:'DM Mono',monospace;padding:2px 5px;border-radius:3px}
  .rb:hover{color:var(--muted);background:var(--surface2)}
  .gb{display:inline-flex;align-items:center;gap:5px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:7px 13px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;transition:all .1s}
  .gb:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div class="sb-head">
      <div class="sb-logo">BioStudy</div>
      <div class="sb-sub">UniMelb · Biology</div>
    </div>
    <div class="sb-nav" id="sb-nav"></div>
  </div>
  <div id="main">
    <div id="topbar">
      <button class="mb active" onclick="setMode('notes')" id="btn-notes">📄 Notes</button>
      <button class="mb" onclick="setMode('flashcards')" id="btn-flashcards">🃏 Flashcards</button>
      <button class="mb" onclick="setMode('quiz')" id="btn-quiz">❓ Quiz</button>
      <button class="mb" onclick="setMode('exam')" id="btn-exam">📝 Exam</button>
      <button class="mb" onclick="setMode('chat')" id="btn-chat">💬 Ask AI</button>
      <div class="topic-title" id="tt">Home</div>
    </div>
    <div id="content"></div>
    <div id="chat-wrap" style="display:none;flex:1;flex-direction:column;overflow:hidden">
      <div id="chat-area"></div>
      <div id="chat-row">
        <textarea id="ci" placeholder="Ask anything about this lecture…" rows="1" onkeydown="hk(event)"></textarea>
        <button id="sb2" onclick="sendChat()">Send</button>
      </div>
    </div>
  </div>
</div>
<script>
const LD = {"Module 1 \u2013 Chemistry of Life": {"What is Life?": "Who am I?\nDr Ollie\nThomas\nOllie's Profile\n\nthomas.o@unimelb.edu.au\n\n\u2022\n\u2022\n\u2022\n\u2022\n\nB147 (BioSciences 4) Level\n1, Office 134A\n\nFeel free to drop into\nmy office if you have\nany questions or\nconcerns.\n\nChemistry\nMaths\nMusic\nPhilosophy\n\nHigh School Teacher\nUnaware that no one\nelse was dressed this\nway for school photos\n\nMarine Biochemistry Research and Lecturing\n\nWhat to expect from Module 1:\nChemistry of Life\nModule 1 Learning Outcomes (MLO)\nAt the end of module 1 you should be able to:\nLecture Learning Outcome\n1\n\nUnderstand how we characterise and categorise living things.\n\n2\n\nRecall fundamental chemistry as it applies to living things.\n\n3-5\n\nUnderstand how macromolecule structure relates to function for the four classes of macromolecule\n\n6\n\nRecall and explain mediation and regulation of transport in cells\n\n7\n\nDescribe the evolutionary processes leading to nuclei, mitochondria and chloroplasts\n\n8\n\nRecall the steps of DNA replication and the phases of mitosis.\n\n5\n\nWhat is Life?\nLearning outcomes:\nAt the end of this lecture, you should be\nable to:\n\u2022 Recall the history of the evolution of\nlife\n\n\u2022 Explain the differences between the\nkingdoms of life\n\u2022 Distinguish between eukaryotic and\nprokaryotic life\n\u2022 Interpret a phylogenetic key\n\n7\n\nWhat is Life?\nHow can we define life?\n\u2022 Composed of a common set of elements\n\u2022 Comprised of cells\n\u2022 Contain genetic information\n\u2022 Grow and change\n\n\u2022 Respond to the environment\n\u2022 Use molecules and make new molecules\n\u2022 Extract energy and use it\n\u2022 Exist in populations and can evolve\n\n8\n\nCell theory is an important unifying\ntheory of biology\n\nIt states:\n\u2022 Cells are the fundamental unit of life\n\n\u2022 All living organisms are comprised of cells\n\u2022 All cells come from pre-existing cells\n\u2022 Modern cells evolved from a common ancestor\n\nWhat do the similarities among living organisms indicate?\n\u2022 All life on Earth has a common ancestry\n\u2022 Evidence points to a common origin of life on our planet\nabout 4 billion years ago\n\n\u2022 All organisms have arisen from earlier, more primitive\nforms over the past 4 billion years through the processes\nof evolution\n\u2022 Because all organisms are related, they share the same\ngenetic code, chemical composition, and cellular structure\n(\u201cbiochemical unity of life\u201d)\n\nEvolution occurs by natural selection\n\u2022 Individuals in a species show a wide range of variation\n\n\u2022 \u2018Fitter\u2019 individuals with characteristics best suited to the\nenvironment are more like to survive and reproduce\n(adaptations leading to differential reproduction)\n\u2022 Given enough time, a species may evolve into a new form\n\nWhere did life come from?\n1. Life formed spontaneously on early Earth (a reducing\nenvironment facilitated organic molecule formation,\nsuch as DNA bases)\ne.g. Miller-Urey Experiments\n1. Extra-terrestrial origin \u2013 life from another planet or\ncomet (panspermia)\ne.g. The Murchison Meterorite\n\nWhen did life arise on Earth?\nLife arose soon after the appearance of liquid water\n\nLife arose on Earth ~3.5 billion years ago\nProkaryotes\n\n~1.4 billion years\n\nStromatolites \u2013 often referred to as \u201cliving\nfossils\u201d\n\nStromatolites thrive in the hyper-saline water of Hamelin Pools in Shark Bay,\nWestern Australia\n\nCyanobacteria\nIt is believed that cyanobacteria first arose around 3.5 billion years ago. However, eukaryotic life has only been\nthought to have arisen 2.1 billion years ago and aquatic and terrestrial multicellular life only arose 600 and 400\nmillion years ago respectively. These times were determined largely through fossil dating.\nProkaryo", "Water and the Fundamental Chemistry of Life": "Learning Outcomes\nAt the end of this lecture, you should be\nable to:\n\u2022 Recall the elements of life\n(C,H,O,N,P,S)\n\u2022 Distinguish between polar covalent,\nnon-polar covalent, and ionic bonding\n\n\u2022 Recognise the three types of\nintermolecular forces (dipole-dipole,\nLondon dispersion, hydrogen bonding)\n\u2022 Understand the physical properties of\nwater and relate them to water\u2019s role\nas the medium of life\nIf you did not study high school Chemistry, please read Hillis et al., Chapter 2!\n\n4\n\nElectronegativity\nThe attraction of an atomic nucleus for outer/bonding electrons.\nNuclear charge increases\nNo. of electron shells increases\n\nThe most\nelectronegative\nelements have the\nfewest shells, and\nhighest positive\nnuclear charge.\nThey are VERY\nattractive to bonding\nelectrons.\n\nSome electronegativities\n\nYou DO NOT need to\nmemorise these!\n\nBond Types\nBond type\nIonic\n\nPolar covalent\n\nNon-polar covalent\n\nElectronegativity\ndifference\n\n>1.9\n\n0.4-1.9\n\n<0.4\n\nDescription\n\n\u2022 More electronegative atom\n\u201csteals\u201d electron(s) from\nother atom.\n\u2022 Creates permanently\ncharged cation (+) and\nanion (-)\n\n\u2022 Two atoms unevenly\nshare a pair of electrons.\n\u2022 The electrons are closer\nto more electronegative\natom.\n\n\u2022 Two atoms evenly\nshare a pair of\nelectrons.\n\u2022 Electrons are\nequidistant between\nnuclei.\n\nExample\n\nNaCl\nNa+ and ClElectronegativity difference\n= Cl(3.1) \u2013 Na (0.9) = 2.2\n\nHCl\n\nCl2\n\nElectronegativity difference Electronegativity\n= Cl (3.1) \u2013 H(2.1) = 1.0\ndifference = Cl (3.1) \u2013 Cl\n(3.1)\n= 0.0\n\nCarbon is the primary component of all known life on Earth\nCarbon dioxide\nhttps://www.chem.purdue.edu/jmol/molecules/\n\nPhenylalanine\nhttps://www.chem.purdue.edu/jmol/molecules/\n\nMandelonitrile\n\nGlucose\nhttps://www.chem.purdue.edu/jmol/\nmolecules/\n\n\u2022 Makes up 18% of the human body but less than 1% of Earth\u2019s\natmosphere and crust\n\u2022 Capable of forming up to 4 covalent bonds with other atoms\nsimultaneously\n\u2022 It can form: 4 single bonds OR 2 single and 1 double bond OR 2 double\nbonds OR 1 single and 1 triple bond.\n\nFunctional Groups\n\u2022\n\nMacromolecules:\nPolymers containing\nthousands or more\natoms. (Large lipids are\ntreated as\nmacromolecules).\n\n\u2022\n\nAll macromolecules\nexcept lipids are\npolymers of smaller\nmolecules called\nmonomers\n\n\u2022\n\nMacromolecule function\ndepends on the\nproperties of functional\ngroups. Each group has\nspecific properties, such\nas polarity.\n\nIntermolecular Forces \u2013 Dipole-dipole force\nWhat makes a molecule polar?\n\n1) Has one more polar bonds.\nhttps://www.breakingatom.com/learn-the-periodic-table/dipole-attraction\n\n\u2022 The attractive force that exists\nbetween oppositely charged\npoles of two different molecules.\n\u2022 Occurs between polar molecules.\n\u2022 Also called hydrophilic\ninteraction.\n\n2) Charge is asymmetrically distributed\nacross the molecule.\n\nIs this molecule polar?\n\nNon-polar\n\u2022 No polar bonds\n\u2022 Charge is\nsymmetrical\n\nNon-polar\n\u2022 4 polar bonds.\n\u2022 Charge is\nsymmetrical\n\nPolar\n\u2022 1 polar bond.\n\u2022 Charge is\nasymmetrical\n\nIntermolecular forces - Hydrogen bonding\n\u2022\n\u2022\n\n\u2022\n\n\u2022\n\nHydrogen has only 1\nproton and 1 electron.\nWhen Hydrogen forms a\ncovalent bond with\nOxygen, Fluorine or\nNitrogen the bond is\nextremely polar.\nThe hydrogen nucleus\nbecomes exposed - a\nnaked positive charge.\nThis naked proton is\nattracted to an unshared\npair of electrons on a\ndifferent atom, creating\na hydrogen bond.\n\nIntermolecular Forces \u2013 Hydrogen Bonding\n\nIntermolecular Forces \u2013 London Dispersion Force\n\nCaroline Monahan, https://www.expii.com/t/dispersion-forces-definition-overview-8351\n\n\u2022 A type of van der Waals f", "Carbohydrates and Lipids": "Learning Outcomes\nAt the end of this lecture, you should be\nable to:\n\u2022 Recall the general structure of\ncarbohydrate monomers.\n\u2022 Distinguish between glycogen,\ncellulose and starch.\n\n\u2022 Describe the basic structures of\ntriglycerides, steroids and\nphospholipids\n\u2022 Explain the importance of the\nrelationship between lipids and water\nwithin cells.\n4\n\nMacromolecules, condensation, hydrolysis\n\u2022 Macromolecules are biological\npolymers, composed of long\nchains of repeating subunits\n(monomers).\n\n\u2022 Condensation reaction: the\nhydroxyl (-OH) functional group\nof two monomers react with\neach other to create a new\ncovalent bond, losing water in\nthe process.\n\u2022 Hydrolysis: An enzymeassisted reaction where water\nis added to a covalent bond,\nsplitting it.\n\nCarbohydrates \u2013 energy and cell structure\n\nSucrose (sugar)\n\nPectin in jam\n\nCarbohydrates are some of the most abundant\norganic compounds in nature\n\n\u2022 Source of chemical energy\n\u2022 Form structural components\n\nFlayyih, Ihsan & Hassan, Ihsan. (2021\n\nBasics of carbohydrates\n\u2022 Have the general formula (CH2O)n\n\u2022 n is the number of carbon atoms. Generally n is between 3 \u2013 8\n\n\u2022 Often have the suffix \u2013ose.\n\u2022 Basic subunit is a sugar molecule or saccharide\nNo. of Subunits\n\nName\n\nMolecular Formula\n\nExamples\n\n1\n\nMonosaccharide\n\nC6H12O6 (hexose)\nC5H10O5 (pentose)\nC3H6O3 (triose)\n\nGlucose, Fructose,\nGalactose (C6)\nRibose, Deoxyribose (C5),\nGlyceraldehyde (C3)\n\n2\n\nDisaccharide\n\nC12H22O11\n\nSucrose, Maltose, Lactose\n\n3-10\n\nOligosaccharide*\n\n(CH2O)n\n\nHuman Milk Oligosaccharide\n\n100s or 1000s\n\nPolysaccharide\n\n(CH2O)n\n\nStarch, Glycogen,\nCellulose, Chitin\n\n*Often part of glycoproteins, involved in cell signalling.\n\nMonosaccharides are simple sugars\n\nGlycosidic bonds\n\u03b1-1,2 glycosidic linkage *\n\n\u03b1-D-glucose\n\nfructose\n\n\u03b1-D-glucose\n\nfructose\n\nsucrose\nA disaccharide is produced from the condensation of two\nmonosaccharides\n* Also called the ether functional group. Both terms are acceptable, but \u201dglycosidic\u201d is only used in\ncarbohydrates.\n\n\u237a-Glucose vs. \u03b2-Glucose\n\nHaworth Projection\n\nHaworth Projection\nFischer Projection\n\nDiversity of disaccharides\nmaltose\n\nglucose\n\nglucose\n\nlactose\n\nglucose\n\ngalactose\n\nsucrose\n\nglucose\n\nfructose\n\nPolysaccharides\n\u237a-glucose subunit\n\nGlycogen\n\nPectin\n\nUsually structural or for energy storage\n\nStarch\n\u2022 Branched polysaccharide of \u237a-glucose\n\n\u2022 Easily degraded by enzymes (amylases)\n\u2022 Primary energy storage compound in plants\nStarch deposit in potato cells\n1\n\n\u237a-1,6\n\n\u237a-1,4\n6\n6\n\n5\n4\n\n1\n3\n\n4\n\n1\n\n2\n\nPolymer of glucose with \u03b1-1,4 and \u03b1-1,6 glycosidic bonds. \u03b1-1,6 glycosidic bonds produce branching at carbon 6\n\nGlycogen\n\nIn animals, glycogen is produced and\nstored in the liver\n\n\u2022 Often called \u201canimal starch\u201d due to the same molecular structure and easily\ndegraded\n\n\u2022 Polymer of glucose with \u03b1-1,4 and \u03b1-1,6 glycosidic bonds. \u03b1-1,6 glycosidic\nbonds produce branching at carbon 6\n\u2022 Primary energy storage compound in animals, fungi, and bacteria\n\nCellulose\n\u2022 Cellulose is the most abundant\npolymer on the planet.\n\u2022 Linear polysaccharide\n\u2022 Differs from starch (\u03b2-glucose\nrather than \u03b1-glucose)\n\u2022 More chemically stable than\nstarch\n\u2022 Major structure of plant cell\nwalls\nPolymer of glucose with \u03b2-1,4 glycosidic bonds\n\n\u2022 Chains are grouped together\nas microfibrils.\n\n\u2022 Microfibrils bundle as fibrils.\n\nCellulose\n\nWhat chemical aspect of\ncellulose allows chains to\nbundle together as\nmicrofibrils?\n\nCellulose fibrils maintain their\nshape through hydrogen bonding\nbetween neighbouring hydroxyl\ngroups.\n\nPage [18]\n\nWohlert et al., 2022\n\nLip", "Nucleic Acids": "Learning Outcomes\nAt the end of this lecture, you should be able to:\n\u2022 Recall the nucleotides and describe how t
