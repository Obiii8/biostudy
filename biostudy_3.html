d gene\n\nribosomal ribonucleic acid\n(rRNA)\n- Structural component of\nribosomes (protein factories)\ntransfer ribonucleic acid (tRNA)\n- transports amino acids for assembly into polypeptides\n\nAll three types are involved in the creation of proteins from amino acids.\n\nThe Central Dogma of Gene Expression\n\nIn most cases, one gene = one polypeptide.\n\nGene Structure\n\u2022\n\nA typical gene consists of:\n\u2022\n\u2022\n\na coding region (transcribed and translated)\nnon-coding regions\n\u2022\n\n\u2022\n\ntranscribed but not translated\nnot transcribed or translated (promoter)\nGene\n\nDNA\n\n5'\n\n3'\n\n3'\n\n5'\n\nTranscription\n\nRNA\n\n5'\n\n3'\n\nTranslation\n\nProtein\n\nNH2\n\nCOOH\n\nNote that the transcription\nsignals (red and green\narrows) are different from the\ntranslation signals (red and\ngreen boxes).\n\nDNA has 6 Reading Frames\nConsider this double-strand of DNA:\n\n5\u2019-ATGAAGTGGGTAACCTTTATTTCCCTTCT-3\u2019\n3\u2019-TACTTCACCCATTGGAAATAAAGGGAAGA-5\u2019\nWe can potentially start each codon in three places:\n5\u2019-ATGAAGTGGGTAACCTTTATTTCCCTTCT-3\u2019\n5\u2019-ATG AAG TGG GTA ACC TTT ATT TCC CTT CT-3\u2019 (+1)\n5\u2019-A TGA AGT GGG TAA CCT TTA TTT CCC TTC T-3\u2019(+2)\n5\u2019-AT GAA GTG GGT AAC CTT TAT TTC CCT TCT-3\u2019 (+3)\n\nDNA has 6 Reading Frames\nConsider this double-strand of DNA:\n\n5\u2019-ATGAAGTGGGTAACCTTTATTTCCCTTCT-3\u2019\n3\u2019-TACTTCACCCATTGGAAATAAAGGGAAGA-5\u2019\nThe complementary strand can also be transcribed, 5\u2019-3\u2019, three ways:\n5\u2019-AGAAGGGAAATAAAGGTTACCCACTTCAT-3\u2019\n5\u2019-AGA AGG GAA ATA AAG GTT ACC CAC TTC AT-3\u2019 (-1)\n5\u2019-A GAA GGG AAA TAA AGG TTA CCC ACT TCA T-3\u2019(-2)\n5\u2019-AG AAG GGA AAT AAA GGT TAC CCA CTT CAT-3\u2019 (-3)\n\nCodons and Open Reading Frame\nOpen Reading Frame: A successive run of non-overlapping codons,\nstarting with AUG and ending with UAA, UAG or UGA.\nCodon: Three nucleo", "Proteins": "Learning Outcomes\nAt the end of this lecture, you should be\nable to:\n\n\u2022 Recognise the structural features of\namino acids and communicate how\nthese inform primary, secondary and\ntertiary structure of proteins.\n\u2022 Explain why change to pH, change to\npolarity or increased temperature can\nlead to denaturation.\n\n4\n\nDNA, RNA and proteins are connected\n\nThe \u201ccentral dogma\u201d of molecular biology\n\nDecoding mRNA into protein\nWe can decode the information from the mRNA strand\n\n5\u2019-AUG AAG UGG GUA ACC UUU AUU UCC CUU-3\u2019\ncodon\n\nN-Met Lys Trp Val Thr Phe Iso Ser Leu-C\n\nM\n\nK\n\nW\n\nV\n\nT\n\nHomo sapien albumin (ALB) - ACCESSION\nNG_009291\n\nF\n\nI\n\nS\n\nL\n\nBasics of proteins\nHighly variable structure & function\n\nMuscles e.g. myosin\n\nhair\nkeratin\nstructural\n\nantibodies\ndefence\n\nRUBISCO\nCO2\nglucose\n\ninsulin\nhormones\n\ncontractile\n\ngluten\n\nProteoglycans\ne.g. cartilage\nmucilage\n\nenzymes\n\ntransport\n\nstorage\n\nAmino acids \u2013 the building blocks of proteins\nAll amino acids have a\ncentral (\u237a) Carbon with 4\nattached groups:\n\u2022 Hydrogen (-H)\n\u2022 A basic amino (-NH2)\n\u2022 An acidic carboxyl (-COOH)\n\u2022 A side chain (-R)\n\nAmino acid in\nzwitterion form\n\nRemember, bases can receive H+ (a proton), acids can donate H+\nIn low pH, NH2 becomes NH3+\nIn high pH, COOH becomes COO-\n\nPeptide bond formation\nCondensation\nreaction\n\n(Also called an amide)\n\nN-terminus\n\nC-terminus\n\nAmino acids are linked together by peptide bonds to\nform proteins\n\nNon-polar,\nhydrophobic R\ngroup\nCan form\ndispersion force\ninteractions.\n\nPolar, electrically\ncharged, hydrophilic\nR group\nCan form electrostatic\n(ionic) interactions.\n\nPolar, uncharged,\nhydrophilic R group\nCan form dipole-dipole\ninteractions or hydrogen\nbonds.\n\nA protein can be described at four levels\nOrder of amino\nacids in a\npolypeptide.\nCaused by hydrogen\nbonding between nonadjacent peptide bonds\nFolding due to R-group\ninteractions on nonadjacent parts of a\npolypeptide.\n\nInteractions between 2\nor more different\npolypeptide chains.\n\nSecondary Structure\n\nAlpha helix or Beta\nsheet is formed\nthrough hydrogen\nbonding between\nnon-adjacent peptide\ngroups (-CONH-)\n\nhttp://www.studymind.co.uk\n\nTertiary Structure\n\nDisulfide link between\nCysteines\nHydrogen bond\n\nElectrostatic (ionic) interaction\n\nDispersion Force\n(hydrophobic)\n\nHydrogen bond with\nwater\n\nProteins can form specific non-covalent interactions with\nother molecules\nSpecificity is influenced by:\n\u2022 Shape. There must be a\ngeneral \u201cfit\u201d between the\nprotein and the other\nmolecule.\n\u2022 Chemistry. Surface R\ngroups interact with other\nmolecules via:\n\u2022 Ion-ion, ion-dipole\n\u2022 Hydrogen bonds\n\u2022 Dispersion Force\n\n\u2022 Dipole-dipole\n\nProtein Denaturation\nProteins, although highly specific, can easily have\ntheir structure changed, through disruption or\nalteration of their side-chains.\nWhen secondary or tertiary structure of a protein is\naltered in this way, it is said to be denatured.\nConditions that lead to denaturation:\n\u2022 High temperature\n\u2022 pH changes\n\u2022 High concentrations of polar molecules\n\n\u2022 Nonpolar substances, via hydrophobic\ninteractions\n\nExam Question: Protein Denaturation\nExplain how each of the following could potentially cause denaturation of a\nprotein:\n\u2022 pH change\n\u2022 temperature increase\n\u2022 addition of a high concentration of a polar molecule\n\u2022 addition of a high concentration of a non-polar molecule.\nIn your answer, refer to any intermolecular forces or bonds that might be\ninvolved.\n\nPage [18]\n\nDefine denaturation\n\u2022 Denaturation is the change to the secondary or tertiary structure of a protein.\n\u2022 It causes the protein ", "The endomembrane system": "Learning Outcomes\nAt the end of this lecture, you should be able to:\n\u2022 Explain the importance of cholesterol structure and degree of\nsaturation of phospholipids in cell membranes and apply this to\nease of diffusion across a membrane at various temperatures.\n\u2022 Distinguish between passive, primary active and secondary active\ntransport.\n\n\u2022 Describe the pathway through the endomembrane system of\nsynthesis, packaging and secretion of macromolecules.\n\n4\n\nBiological membranes are comprised of phospholipid\nbilayers\nFluid mosaic model\n\nOutside cell\n\nBilayer\nInside cell\n\nThe plasma membrane\n\u2022 Structure: The phospholipids form a bilayer, with\nthe two groups of tails sandwiched towards the\ninterior, one group of Phosphate heads towards\nthe cytoplasm (aqueous), other towards the cell\u2019s\nexterior (aqueous)\n\u2022 Role: prevents free flow of liquids into/out of cells\ndue to the hydrophobic middle layer, and protects\ncell\u2019s interior\n\u2022 Cell membranes are not rigid\n\u2022 The phospholipids are mobile\n\u2022 they move laterally all the time, along the plane\nof the membrane\n\u2022 Membranes must be fluid to work properly\n7\n\nPhospholipids form closed vesicles in water\n\u25aa Phospholipids comprise the largest\n\ncomponent of all biological\nmembranes\n\u25aa One part of a phospholipid is\n\nhydrophobic (the fatty acid tails),\nand another part is hydrophilic (the\nphosphate head)\n\n\u25aa The head can interact with polar\nsubstances (including water), the tail\nis attracted to other tails via LDF.\n\nThe effect of double bonds\n\nPresence of double bonds\nintroduces \u201ckinks\u201d, reducing\npacking, increasing\npermeability.\n\n40\n35\n30\n\n50% unsaturated\ntails cholesterol\n0%\n\n25\nMembrane\npermeability to 20\nglycerol (units)\n15\n\n20% unsaturated\ntails\n\n20% cholesterol\n0% unsaturated tails\n\n10\n\n50% cholesterol\n\n5\n0\n0\n\n5\n\n10\n\n15\n20\n25\nTemperature deg C\n\n30\n\n35\n\nFigure 1. The change in glycerol permeability of three different liposome membranes\n(0%, 20% and 50% polyunsaturated tails) with respect to temperature.\n\nThe effect of cholesterol\n\u2022 Four fused ring structure that is largely\nnonpolar.\n\u2022 Can form LDF with adjacent fatty acid\ntails.\n\u2022 Hydroxyl group (-OH) can interact with\nphosphate head of phospholipid by iondipole.\nAt high temperatures:\n\u2022 Decreases permeability through enhancing\nclose packing.\nAt very low temperatures:\n\u2022 Interferes with close packing, increasing\npermeability.\n\nCholesterol\n\nPassive Transport (Diffusion)\n\u2022 Substances diffuse down their concentration\ngradients.\n\u2012 From an area of high concentration, to an\narea of low concentration.\n\n\u2022 This results in a uniform distribution of the\nsubstance over time.\n\u2022 It reaches an equilibrium: equal movement in\n\nall directions.\n\u2022 Osmosis is the diffusion of water across a\nselectively permeable membrane.\n\n12\n\nPassive Transport\n\u2022 Small, neutral molecules can\ndiffuse through the membrane.\n\u2022 Large molecules and ions cannot\ndiffuse through.\n\n13\n\nFacilitated diffusion\n\u2022 Transport proteins allow passage of\nhydrophilic substances across the\nmembrane.\n\n\u2022 Some transport proteins, called\nchannel proteins, have a hydrophilic\nchannel that certain molecules or ions\ncan use as a tunnel.\n\n\u2022 Other transport proteins, called carrier\nproteins, bind to molecules and\nchange shape to shuttle them across\nthe membrane.\n14\n\nSymporter\nUniporter\n\nAntiporter\n\n15\n\nActive Transport\n1) Requires ATP or another energy\nsource\n2) Goes against an electrochemical\nconcentration gradient\n\nPrimary: Directly uses ATP to move\nmolecules against their own gradient\n(pumps)\nSecondary: Creates an electrochemical\ngra", "The Evolution of the Eukaryotic Cell": "Learning Outcomes\nAt the end of this lecture, you should be able to:\n\u2022 Describe the basic structures of the nucleus, mitochondria and\nchloroplasts\n\u2022 Justify how the nucleus may have evolved through membrane\ninvagination.\n\n\u2022 Explain the evidence that mitochondria (all eukaryotes) evolved from\nthe process of primary endosymbiosis.\n\u2022 Compare chloroplasts (in plants and protists) obtained by primary and\nsecondary endosymbiosis.\n\n4\n\nWhen did eukaryotes evolve?\n\nGrypania spiralis fossils\n(2.1 billion years old)\nDistinctive spirally coiled\nphotosynthetic \u201calgae\u201d\n\nWhy don\u2019t we have early,\nsimple animal fossils?\n\nNucleus\n\u2022 Surrounded by a double membrane or nuclear\nenvelope\n\u2022 Presence of nuclear (annular) pores (50 nm in\ndiameter) control movement of molecules\nacross the envelope.\n\u2022 Contains most of the DNA\n\u2022 Site of DNA replication\n\u2022 Site where gene transcription is turned on or off\n\u2022 nucleolus = subregion of nucleus containing\n(transcribing) ribosomal genes (ribosomal\nbiogenesis)\n\n\u2022 Nucleus is continuous with the endoplasmic\nreticulum.\n\nPage [6]\n\nNucleus\n\u2022 DNA in long strands covered with\nhistones = chromosomes\n\u2022 Different organisms have\n\ndifferent numbers of\nchromosomes\n\nProtist\n\n\u2022 RNA transcribed from DNA\nleaves nucleus via pores and is\ntranslated in the cytoplasm\nHuman chromosomes\n\nChromosomes\n\u2022 The chromosome containing organelle of a\neukaryotic cell Chromosomes : genetic\n\nmaterial one long DNA molecule. Each\nchromosome is made up of material called\nchromatin a complex of proteins and DNA\n\u2022 Each eukaryotic and prokaryotic species\nhas a characteristic number of\n\nchromosomes\n\nWhat is the likely origin of the nucleus?\nThe nucleus may have\nformed from\ninvaginations of the\nplasma membrane\naround the nucleoid of\nan ancient prokaryote\n\nMitochondrion (pl. Mitochondria)\n\u2022 Cells may contain several of these organelles or\nhave a single, large mitochondrion.\n\n\u2022 They are surrounded by two membranes, an\nouter membrane and a highly convoluted inner\nmembrane, whose inward projections are called\ncristae.\n\u2022 Mitochondria carry out the aerobic respiration\nof all eukaryotic cells\n\nMitochondrion\n\u2022 Energy in fuel molecules such as glucose is\ntransformed to the bonds of energy-rich ATP\n(cellular respiration).\n\u2022 Cells that require a lot of energy have many\nmitochondria.\n\u2022 They can reproduce and divide independently\nof the central nucleus.\n\u2022 Mitochondria have two membranes.\n\u2022 Inner membrane folds inward to form\ncristae\u2014creates large surface area for the\nembedded proteins involved in cellular\nrespiration.\n\u2022 Mitochondrial matrix contains DNA and\nribosomes to make the proteins needed for\ncellular respiration.\n\nPage [11]\n\nChloroplasts\n\u2022 Cells may contain one or many\nchloroplasts per cell.\n\u2022 Site of photosynthesis \u2013 the\nconversion of light energy into\nchemical energy.\n\u2022 Have a double membrane. Can\ndivide independently of the nucleus.\n\u2022 Inner membrane forms thylakoids\nwhich contain chlorophyll and other\npigments that harvest light energy.\nPage [13]\n\nWhat are the likely origins of mitochondria and\nchloroplasts?\n\nIt is thought that mitochondria arose\nfrom primary endosymbiosis of a purple\nbacteria \u2013 this single event gave rise to\nthe mitochondria in all eukaryotes\n\nWhat are the origins of these organelles?\n\nChloroplasts arose from primary\nendosymbiosis of a photosynthetic\ncyanobacteria \u2013 this single event\ngave rise to the chloroplasts in all\nalgae and land plants\n\nEndosymbiosis and the Origin of\nChloroplasts\n\u2022 Cyanobacteria and purple bacteria are\nsurrounded by two membran", "DNA Replication and Mitosis": "Learning Outcomes\nAt the end of this lecture, you should be able to:\n\u2022 Describe the structure and function of cytosol and the\ncytoskeleton\n\u2022 Recall and understand the differences in DNA replication in\neukaryotes and prokaryotes\n\n\u2022 Recall and understand the phases of mitosis and how this is\nmediated by the cytoskeleton\n\u2022 Distinguish between mitosis and binary fission.\n\n4\n\nCellular maintenance, growth and development\nrequires cell division\n\nCell division rates are highly variable\nGerminating\nplants require\nfast division\n\nE.coli can\nhave very\nrapid cell\ndivision\n\nNeurons\ndo not\ndivide\n\nEmbryos\nrapidly\ndivide\n\nThe cytosol \u2013 the metabolic heart\n\u2022 Site of numerous biochemical processes\n\u2022 Many biochemical intermediates are shuttled\nand often converted during the transition\n\u2022 The space between organelles and\nendomembrane\n\u2022 Protein biosynthesis\n\u2022 Cytoskeleton\n\nThe Cytoskeleton - maintaining shape and\nfacilitating cell movements\n\u2022 Components of the cytoskeleton are composed of\nprotein, NOT membrane.\n\n\u2022 Cytoskeletal components act as a form of scaffolding\nor as structural elements within the cytoplasm of cells.\n\u2022 It organizes cellular structures and activities,\nanchoring many organelles.\n\u2022 It is composed of three types of molecular structures:\n\u2022 microfilaments\n\u2022 intermediate filaments\n\u2022 microtubules\n\nactin\n\nmicrotubules\n\nThe Cytoskeleton - maintaining shape and\nfacilitating cell movements\n\nCell Cycle and DNA replication\n\nFor cell division to be successful, the genetic\nmaterial in the nucleus must be duplicated\naccurately, and one copy must be distributed to\neach daughter cell. This duplication of the cell\u2019s\ngenetic material is called DNA replication.\n12\n\nDNA Replication\n\u2022 DNA replication is semi-conservative. This allows for repair.\n\nDNA Replication\n\u2022 Nucleotides are added in a 5\u2019 \u2192 3\u2019\ndirection\n\u2022 DNA:\n\u2022 Has directionality (polarity)\n\u2022 Strands run in opposite directions\n(anti-parallel)\n\u2022 DNA polymerase III:\n\u2022 Enzyme that synthesises DNA\n\u2022 Only runs in one direction, adding\nnucleotides to the 3\u2019 end.\n\nDNA Replication: Prokaryotes Vs Eukaryotes\nori\n\nProkaryotes have a\nsingle origin of\nreplication (ori)\nalong their DNA\nori\n\nori\n\nori\n\nEukaryotes have\nmultiple origins of\nreplication (ori)\nalong the\nchromosome\n\nThe prokaryotic cell cycle\nChromosome\nduplicated\n\nIn rapidly dividing cells (less than 60 min) the Gap phase (B) is\nbypassed\n\nThe Cell Cycle - Prokaryotes\n\u2022 Cell division in prokaryotic cells\ndoes not involve mitosis.\n\u2022 The term binary fission, meaning\n\u201cdivision in half,\u201d refers to this\nprocess and to the asexual\nreproduction of single-celled\neukaryotes, such as the amoeba.\n\nUrry, L. A., Cain, M. L., Wasserman, S. A., Minorsky, P. V., Orr, R. (20200102).\nCampbell Biology, 12th Edition [VitalSource Bookshelf version]. Retrieved from\nvbk://9780135858141\n\n19\n\nCell division in prokaryotes\noccurs by binary fission\n\u2022 FtsZ protein (filament temperature sensitive)\n\n\u2022 FtsZ forms protein fibres that constricts the cell\n\u2022 FtsZ is a homologue of the eukaryotic\ncytoskeletal protein tubulin (flagella, mitosis)\n\u2022 Also involved in the division of chloroplasts and\nmitochondria\n\nThe Cell Cycle:\nEukaryotes\n\u2022 Mitosis is just one part of the cell\ncycle.\n\u2022 The mitotic phase is usually the\nshortest part of the cell cycle.\n\u2022 Interphase accounts for about\n90% of the cycle.\n\u2022\n\nInterphase can be divided into\nthree phases:\n\u2022 the G1 phase (\u201cfirst gap\u201d),\n\u2022 the S phase (\u201csynthesis\u201d), and\nthe\n\u2022 G2 phase (\u201csecond gap\u201d).\nUrry, L. A., Cain, M. L., Wasserman, S. A., Minorsky, P. V."}, "Module 2 \u2013 Energy & Cells": {"What is Bioenergetics?": "What is bioenergetics?\nLearning outcomes:\nAt the end of this lecture you should be able to:\n\n\u2022 Recall the different types of energy in biological\nsystems\n\u2022 Explain the fundamental principles of energy\ntransfer\n\u2022 Describe the role of ATP in bioenergetics\n\u2022 Describe exergonic and endergonic chemical\nreactions\n\nhttps://elevatedac hievement.com /articles/why-measurable-and-achievable-learning-outcomes-are-imperative-to-eac h-and-every-lesson\n\n\u2022 Describe catabolic and anabolic reactions\n\u2022 Explain the significance of redox reaction in\nbioenergetics\n\nHigh school science\nrefresher (Year 8/9)\n\nForms of energy\n\u2022 A chemical reaction occurs when atoms have sufficient\nenergy to combine or change their bonding partners.\n\u2022 Physicists define energy as the capacity to do work, which\noccurs when a force operates on an object over a distance.\n\u2022 Bioenergetics is the study of how organisms manage their\nenergy resources\n\n\u2022 Energy is the capacity to cause change.\n\u2022 Energy can be converted from one form to another\n\u2022 Energy exists in various forms, some of which can perform\nwork\n\nhttps://www.richardsonthebrain.c om/biological-energy\n\nForms of energy\nAll forms of energy fall into 2 basic types in\nbiology:\n1. Potential energy: is the energy of state or position\u2014\nthat is, stored energy. It can be stored in many\nforms: in covalent bonds, as a concentration\ngradient, or even as an electric charge imbalance.\n2. Kinetic Energy: is the energy of movement\u2014that is,\nthe type of energy that does work, that makes things\nchange. For example, heat causes molecular\nmotions and can even break chemical bonds.\n\nBrain Teaser Energy Change\n\nTo the left is an image of a cat in space. On the surface of earth, gravity (g) is equal to\n9.81 meters per second squared. The value of g decreases very slowly as you move\naway from the surface of earth.\n\nThink about the chemical and kinetic energy the cat needs to jump from the floor to\nthe desk. Will this be the same in space?\n9\n\nBrain Teaser\nEnergy Change\nYour answer\n\nYour\njustification\n\nApplication to\nlionesses here\non Earth\n10\n\nPhysics is everywhere \u2013 even in Biology\n\u2022 Thermodynamics is the study of energy\ntransformations.\n\n\u2022 A closed system, such as that\napproximated by liquid in a thermos, is\n\nisolated from its surroundings.\n\u2022 In an open system, energy and matter\n\ncan be transferred between the system\nand its surroundings.\n\u2022 Organisms are open systems.\n\nThe first law of thermodynamics\n\u2022 According to the first law of\nthermodynamics, the energy of the universe\n\nis constant:\nEnergy can be transferred and transformed,\nbut it cannot be created or destroyed.\n\u2022 The first law is also called the principle of\n\nconservation of energy\n\nThe second law of thermodynamics\nDuring every energy transfer or transformation, some energy is unusable,\n\nand is often lost as heat.\nAccording to the second law of thermodynamics:\n\u2022 Every energy transfer or transformation increases the entropy (disorder) of\nthe universe.\n\nThermodynamics in nature\n\nUrry, L. A., Cain, M. L., Wasserman, S. A., Minorsky, P. V., Orr, R. (20200102). Campbell Biology, 12th Edition [VitalSource\nBookshelf version]. Retrieved from vbk://9780135858141\n\nBiological order and disorder\n\u2022 Cells create ordered structures from less ordered materials.\n\u2022 Organisms also replace ordered forms of matter and energy with less ordered\n\nforms.\n\u2022 Energy flows into an ecosystem in the form of light and exits in the form of heat.\n\u2022 The evolution of more complex organisms does not violate the second law of\nthermod", "An introduction to Enzymes": "Speeding up chemical reactions\nLearning outcomes:\n\nAt the end of this lecture, you should be able to:\n1. Explain the role of enzymes in cellular process\n\n2. Rationalism the speed of enzymatic reactions\nand what factors can affect these.\n\nhttps://elevatedac hievement.com /articles/why-measurable-and-achievable-learning-outcomes-are-imperative-to-eac h-and-every-lesson\n\nWhy are enzymes important\n\u2022 Enzymes are critical for metabolism and digestion\n\n\u2022 Enzymes do more than speed up reactions, they also control the\nreactions\n\u2022 Over 1,000 different reactions can occur in a living cell\n\u2022 A specific enzyme may control each individual reaction, and so\nsmall, gentle steps can control the very complex metabolism of a\ncell by enzymes\n\u2022 Many have important Clinical Applications\n3\n\nWhy are enzymes important\n\nMartelli, F., Lin, J., Mele, S., Imlach, W., Kanca,\nO., Barlow, C. K., Paril, J., Schittenhelm, R. B.,\nChristodoulou, J., Bellen, H. J., Piper, M. D., &\nJohnson, T. K. (2024). Identifying potential\ndietary treatments for inherited metabolic\ndisorders using Drosophila nutrigenomics. Cell\nReports, 43(3).\nhttps://doi.org/10.1016/j.celrep.2024.113861\n\n4\n\nQuestion\n\nMy answer\n\nThe presence of an enzyme catalyst\naffects the\u2026.\n\nThe molecules that are activated on by\nenzymes are called\u2026\n\n5\n\nActivation energy initiates reactions\n\nEnzymes speed up biochemical\ntransformations\nEnzymes\n\u2022 catalyse nearly all the chemical reactions\ntaking place in the cells\n\n\u2022 increase the rate of reaction by lowering\nthe energy of activation\nFor example, the enzyme carbonic anhydrase\nlowers the activation energy for the reaction:\n\nEnzyme Catalysis\nEnzyme: A biological catalyst\n\n\u2022 Except for some RNAs that catalyse their own self-cleavage, all enzymes are proteins.\n\u2022 Enzymes can increase the rate of a reaction by a factor of 109 to 1020 over an\nuncatalyzed reaction.\n\u2022 Some catalyse the reaction of only one compound.\n\n\u2022 Others are stereoselective; for example, enzymes that catalyse the reactions of only Lamino acids.\n\u2022 Others catalyse reactions of specific types of compounds or bonds; for example, trypsin\ncatalyses hydrolysis of peptide bonds formed by the carboxyl groups of Lys and Arg.\n8\n\nEnzyme Catalysis\nTrypsin catalyses the hydrolysis of peptide bonds formed by the carboxyl group of lysine and\narginine.\n\n9\n\nEnzyme Names\nThe name of an enzyme\n\u2022 is derived by replacing the end of the name of the reaction or reacting\ncompound with the suffix ase\n\n\u2022 identifies the reacting substance\u2014for example, sucrase catalyses the\nreaction of sucrose\n\u2022 describes the compound or the reaction that is catalysed \u2014 for example,\noxidase catalyses an oxidation reaction\n\u2022 could be a common name, particularly for the digestion enzymes, such as\npepsin and trypsin\n\n10\n\nReaction\n\nType of catalysis\n\nform bonds between molecules using ATP energy\n\nrearrange atoms in a molecule to form an isomer\ntransfer a group between two compounds\nhydrolysis reactions\n12\n\nEnzyme active site binds the substrate\n\nEnzyme active site binds the substrate:\nWhat you may have been told\nLock-and-key model of enzyme mechanism:\n\nThe Induced-fit model of an enzyme mechanism:\n\n\u2022\n\nThe enzyme is a rigid three-dimensional body.\n\n\u2022\n\n\u2022\n\nThe enzyme surface contains the active site.\n\nThe active site becomes modified to\naccommodate the substrate.\n\n14\nhttps://stock.adobe.com/au/images/biological-diagram-show-mechanism-of-enzyme-substrate-interaction-by-lock-and-key-model-and-induced-fit-model/477984872\n\nEnzyme active site binds the substrate:\nM", "Enzyme regulation": "Enzyme regulation\nLearning outcomes:\n\nAt the end of this lecture you should be able to:\n1. Explain how inhibitors and allosteric changes\nin an enzyme can be used to regulate flow\nthrough a metabolic pathway\n\n2. Describe the role of feedback inhibition on\nenzyme activity\n\nhttps://elevatedac hievement.com /articles/why-measurable-and-achievable-learning-outcomes-are-imperative-to-eac h-and-every-lesson\n\nQuestion\n\nYour Answer\n\nTrypsin and elastase are both\nenzymes that catalyze hydrolysis of\npeptide bonds. However, trypsin only\nhydrolysis peptide bonds next to\nlysine, and elastase only hydrolyzes\npeptide bonds next to alanine. Why?\n\nHow are the mechanisms used by\nenzymes to catalyze reactions are\nsimilar?\n4\n\nAn enzyme isolated from a mutant\nbacterium grown at 20\u00b0c works in a test\ntube at 20\u00b0c but not at 37\u00b0c (37\u00b0c is the\ntemperature of the gut, where this\nbacterium normally lives). furthermore, once\nthe enzyme has been exposed to the higher\ntemperature, it no longer works at the lower\none. The same enzyme isolated from the\nnormal bacterium works at both\ntemperatures.\nCan you suggest what happens (at the\nmolecular level) to the mutant enzyme as\nthe temperature increases?\n\nMy answer:\n\n5\n\nEnzymes activities can be regulated\n\nEnzyme activity can be controlled in two\nways:\n\u2022 Regulation of gene expression\u2014how\nmany enzyme molecules are made\n\u2022 Regulation of enzyme activity\u2014enzyme\nmay change shape, or be blocked by\nregulators\n\n6\n\nEnzyme inhibitors\n\u2022 Competitive inhibitors bind to the active site of\n\nan enzyme, competing with the substrate.\n\u2022 Noncompetitive inhibitors bind to another part of\nan enzyme, causing the enzyme to change\n\nshape and making the active site less effective.\n\u2022 Examples of inhibitors include toxins, poisons,\n\npesticides, and antibiotics.\n\nBrain teaser\nEnzyme inhibition (Competitive)\nWhy does increasing the\nsubstrate concentration\nreverse the inhibition by a\ncompetitive inhibitor?\nMy answer:\n\n8\n\nBrain teaser\nEnzyme inhibition (non competitive)\nWill an increase in\nsubstrate concentration\nreverse the inhibition by a\nnoncompetitive inhibitor?\nMy answer:\n\n9\n\nEnzyme inhibition\n\nFood for thought: What type of inhibition occurs when Sarin, a nerve\ngas, forms a covalent bond with the R group of serine in the active site\nof acetylcholinesterase?\n10\n\nBrain Teaser - Enzyme inhibition\nQuestion\n\nMy answer\n\nWhat type of inhibition occurs when\nSarin, a nerve gas, forms a covalent\nbond with the R group of serine in the\nactive site of acetylcholinesterase?\nWhich will not increase the rate of\nconversion of reactant A to product B in\nthe presence of enzyme C?\n11\n\nBrain Teaser \u2013\nEnzyme inhibition\nOxaloacetate is an inhibitor of succinate dehydrogenase\nQuestion\n\nMy answer\n\nWould you expect oxaloacetate to be a\ncompetitive or a noncompetitive inhibitor?\nWhy?\nWould oxaloacetate bind to the active site\nor elsewhere on the enzyme?\nHow would you reverse the effect of the\ninhibitor?\n12\n\nEnzyme inhibitors\n\u2022 Irreversible inhibition: Inhibitor\ncovalently bonds to side chains in the\nactive site and permanently inactivates\nthe enzyme.\n\u2022 Aspirin binds to cyclooxygenase (COX)\nand transfers an acetyl group, which\nbinds to the active site.\n\u2022 Prostaglandin is no longer produced\nand its stimulation of inflammation and\npain are blocked.\n\nAllosteric Regulation\n\u2022 Allosteric - Term is derived from Greek, which means other shape\n\u2022 Allosteric regulation: a non-substrate molecule binds enzyme at a\nsite different from the active site, which changes enzyme shape.\nActive form\u2014", "Biomolecule Creation and Destruction": "Biomolecule creation and destruction\nLearning outcomes:\nAt the end of this mini lecture, you should be able\nto:\n1. Describe catabolic and anabolic pathways that\nlink carbohydrate, lipid and protein\nmetabolism\n\nhttps://elevatedac hievement.com /articles/why-measurable-and-achievable-learning-outcomes-are-imperative-to-eac h-and-every-lesson\n\nControl of metabolic pathways often rests with\nregulation of enzymes already present.\nLet\u2019s Revise \u2013 Why are enzymes important\n\nLet\u2019s Revise\nWhy are enzymes important\nQuestion\n\nMy answer\n\nIn an experiment, a small amount of allosteric inhibitor is\nadded to tube A and no inhibitor is added to tube B. The\nfull reaction is completed in tube B twice as quickly as it is\ncompleted in tube A. The allosteric inhibitor acted by\nIn the presence of alcohol dehydrogenase, the rate of\nreduction of acetaldehyde to ethanol increases as the\nconcentration of acetaldehyde increases. Eventually, the\nrate of the reaction reaches a maximum, at which point\nfurther increases in the concentration of acetaldehyde\nhave no effect. Why?\nEnd products of biosynthetic pathways often act to block\nthe initial step in that pathway. This phenomenon is called\n4\n\nBrain Teaser\nWhy are enzymes important\nMost biochemical pathways can operate essentially in both directions,\nand also can operate with increased or decreased rates. How does this\nregulation occur? Give an example.\nMy answer:\n\n5\n\nWhy are enzymes important\nSeveral mechanisms can be used to regulate the rate of each step in a\nbiochemical pathway:\n\u2022 Changing the amount of active enzyme: The cell can increase the\nexpression of a gene encoding an enzyme.\n\u2022 Changing enzyme activity by covalent modifications: Adding phosphate\ngroups by protein kinase can alter the activity of an enzyme.\n\u2022 Feedback inhibition: Allosteric changes in an enzyme due to binding of a\nproduct in a pathway can cause the entire pathway to shut down.\n\u2022 Substrate availability: If the substrate of a particular enzyme is used up by\nanother pathway, the first enzyme can no longer function and the pathway\nshuts down.\n6\n\nMetabolism\nis more\ncomplex than\njust breaking\ndown sugar\n\nWhat is metabolism\n\u2022 Chemical reactions that\noccur in living systems are\ncalled biochemical reactions.\n\u2022 Most of the time in biological\nsystems, chemical reactions\noccur in a series called a\nmetabolic pathway.\n\u2022 Metabolism can be\nconsidered in two parts,\ncatabolism and anabolism.\n\nWhat is metabolism\n\u2022 Catabolism refers to chemical reactions in which larger molecules are broken down\ninto a few common metabolites. Because catabolism breaks down molecules, we\nsee many hydrolysis and oxidation reactions in catabolic pathways. These reactions\ntend to be exergonic (\u2212\u0394G).\n\u2022 Anabolism refers to chemical reactions in which metabolites combine to form larger\nmolecules. In anabolic pathways, many of the reactions are condensation or\nreduction reactions. These reactions tend to be endergonic (+\u0394G). These\nrelationships are summarized in Table 12.1.\n\nWhat is metabolism\n\u2022 Carbohydrates, fats, and proteins can all be used as fuel for cellular respiration.\n\n\u2022 Monomers of these molecules enter glycolysis or the citric acid cycle at various\npoints.\n\u2022 Glycolysis and the citric acid cycle are catabolic funnels through which electrons\nfrom all kinds of organic molecules flow on their exergonic fall to oxygen.\n\u2022 Cells need substance as well as energy.\nNot all the organic molecules of food are destined to be oxidized as fuel to\nmake ATP. In addition to calories, food m", "Intro to Glycolysis and the TCA Cycle": "Biomolecule\nreview\n\u2022 Carbohydrates, fats, and\nproteins can all be used as\nfuel for cellular respiration.\n\u2022 Monomers of these\nmolecules enter glycolysis\nor the citric acid cycle at\nvarious points.\n\u2022 Glycolysis and the citric acid\ncycle are catabolic funnels\nthrough which electrons\nfrom all kinds of organic\nmolecules flow on their\nexergonic fall to oxygen.\n2\n\nAn introduction to glycolysis\nLearning outcomes:\nAt the end of this lecture, you should be able to:\n\n1. Explain the major steps in glycolysis.\n2. Describe where it takes place.\n3. Recall the control points in glycolysis\n\n4. Recall how energy is generated by the TCA cycle\n5. Appreciate the importance of the TCA cycle and\nglycolysis in anabolism.\n\nhttps://elevatedac hievement.com /articles/why-measurable-and-achievable-learning-outcomes-are-imperative-to-eac h-and-every-lesson\n\nNote: Citric Acid Aycle = Kreb\u2019s Cycle = Tricarboxylic Acid (TCA) Cycle\n\nRecall Respiration \u2013\nKnowledge Check\n\u2022 Glycolysis and the citric acid cycle constitute\na small fraction of the reactions that occur in\na cell.\no Circles = molecules in various metabolic\npathways\no Lines = enzymatic reactions that\nconvert one metabolite to another\n\u2022 Both catabolic and anabolic pathways\no delivering small organic molecules to be\noxidized for energy, or\no supplying carbon compounds for\nbiosynthesis.\n4\n\nRecall Respiration \u2013 Knowledge Check\nQuestion\n\nMy answer\n\nBefore entering the citric acid cycle,\ncarbohydrates are processed by\nglycolysis while lipids are processed\nby \u00df-oxidation. Although different,\nboth metabolic pathways result in the\nproduction of:\nMore free energy is harvested during\nthe citric acid cycle than during\nglycolysis, but only 1 mole of ATP is\nproduced for each more of acetyl CoA\nthat enters the cycle. Most of the\nremaining free energy released\nduring the citric acid cycle is:\nA student prepared this table as an\naid to her study of these metabolic\nprocesses. Which statement best\nevaluates the accuracy of the\nstudent\u2019s work?\n\n5\n\n\u2022 Glycolysis and the citric acid cycle\nprovide the precursors needed for\ncells to synthesize many important\norganic molecules.\n\u2022 The amino acids, nucleotides, lipids,\nsugars, and other molecules\u2014shown\nhere as products\u2014in turn serve as\nthe precursors for many of the cell\u2019s\nmacromolecules.\n\n\u2022 Each black arrow in this diagram\ndenotes a single enzyme- catalyzed\nreaction; the red arrows generally\nrepresent pathways with many steps\nthat are required to produce the\nindicated products.\n8\n\nAn introduction to Glycolysis\n\nUrry, L. A., Cain, M. L., Wasserman, S. A., Minorsky, P. V., Orr, R. (20200102). Campbell Biology, 12th Edition [VitalSource\nBookshelf version]. Retrieved from vbk://9780135858141\n\nGlycolysis\n\nGlycolysis\n\n\u2022 Takes place in the cytoplasm\n\u2022 Converts glucose into 2 molecules of\npyruvate\n\u2022 Produces 2 ATP and 2 NADH\n\n\u2022 Occurs in 10 steps\n\nSteps in Glycolysis\n\n\u2022 Steps 1\u20135 require ATP\n(energy-investing reactions).\n\u2022 Steps 6\u201310 yield NADH and\nATP (energy-harvesting\nreactions)\n\nEnergy investment Step\n\nUrry, L. A., Cain, M. L., Wasserman, S. A., Minorsky, P. V., Orr, R. (20200102). Campbell Biology, 12th Edition [VitalSource\nBookshelf version]. Retrieved from vbk://9780135858141\n\nEnergy Harvesting Reactions\n\nUrry, L. A., Cain, M. L., Wasserman, S. A., Minorsky, P. V., Orr, R. (20200102). Campbell Biology, 12th Edition [VitalSource\nBookshelf version]. Retrieved from vbk://9780135858141\n\nRegulation of glycolysis\n\nTCA cycle\n\nRecall\u2026\n\nGlycolysis reactions are controlled by enzyme regulation\n15\n\n", "Energy Production with/without Oxygen": "Learning Outcomes\n\nAt the end of this lecture, you should be able to:\n1. Describe how the electron transport chain\nand chemiosmosis work together to generate\nenergy when oxygen is present\n2. Describe how a cell can generate energy\nwhen oxygen is absent.\n\nhttps://elevatedac hievement.com /articles/why-measurable-and-achievable-learning-outcomes-are-imperative-to-eac h-and-every-lesson\n\nLet\u2019s revise\n\u2022 Glycolysis, which occurs in the cytosol,\nconsists of 10 reactions that degrade\nglucose (6C) to two pyruvate (3C).\n\u2022 The overall series of reactions in\nglycolysis yields two NADH and two\nATP.\nIdentify the reaction(s) and compounds in\nglycolysis that have each of the following:\na) requires ATP\nb) converts a six-carbon compound\nto two three-carbon compounds\nc) converts ADP to ATP\n4\n\nLet\u2019s revise\nQuestion\n\nFill in the missing terms\nin the Nutrient Use in\nCellular Metabolism\ndiagram below.\nMy answer\n\nIdentify the reaction(s) and\ncompounds in glycolysis that have\neach of the following:\na) requires ATP\nb) converts a six-carbon\ncompound to two threecarbon compounds\nc)\nconverts ADP to ATP\n\nHow many molecules of CO2\nare produced by one pass\nthrough the citric acid cycle?\n5\n\nOxidative Phosphorylation Forms ATP\nWhere are we at?\n\nOxidative phosphorylation: ATP is synthesized by reoxidation of electron\ncarriers in the presence of O2.\n\nTwo components:\n\u2022 Electron transport\n\u2022 Chemiosmosis\n\n(1)\n\nElectron Transport and Oxidative\nPhosphorylation\n\u2022 In electron transport, or the respiratory chain, hydrogen\nions and electrons from NADH and FADH2 are passed\nfrom one electron carrier to the next and combine with\noxygen to make H2O.\n\u2022 The energy released during electron transport is used to\nsynthesize ATP from ADP and Pi, a process called\noxidative phosphorylation.\n\u2022 Oxidative Phosphorylation relies on a proton gradient\nbetween hydrogen ion concentrations in the mitochondrial\nmatrix and the intermembrane space\n\n8\n\nElectron\nTransport\nChain\n\n9\n\nUrry, L. (2020-01-02). Campbell Biology, 12th Edition\n\nATP Synthase\nProduce ATP by a\nChemiosmotic\nMechanism\nThe process of oxidative\nphosphorylation couples the energy\nfrom electron transport to the synthesis\nof ATP from ADP.\nADP + Pi + energy --> ATP\n\nOverall ATP Yield\n\nWhat we have shown you here is a simplified version of what is happening.\n\nPlease note:\n30?\n\n32?\n\n34?\n\n36?\n\n38?\n\nDuring oxidative phosphorylation, each pair of electrons donated by the NADH produced in\nmitochondria is thought to provide energy for the formation of about 2.5 molecules of ATP, after\nsubtracting the energy needed for transporting this ATP to the cytosol. Oxidative phosphorylation also\nproduces 1.5 ATP molecules per electron pair from FADH2, or from the NADH molecules produced by\nglycolysis in the cytosol. From the product yields of glycolysis and the citric acid cycle, one can\ncalculate that the complete oxidation of one molecule of glucose\u2014starting with glycolysis and ending\nwith oxidative phosphorylation\u2014gives a net yield of about 30 ATPs.\nBiology is a science of exceptions and variations!\n12\n\nAlso note:\n\n\u2022 The number of active ATP\nsynthases per mitochondrion\nranges from 5000 to just about\na hundred.\n\u2022 The absolute total number of\nATP synthase molecules per\nmitochondrion, regardless of\ntheir activity status, can be up\nto two orders of magnitudes\nhigher.\n\u2022 That is a lot of oxidative\nphosphorylation occurring at\n13\nonce!\n\nLet\u2019s revise\nThe ETC\nQuestion\n\nMy answer\n\nWhich statement about the\nrespiratory chain explains the\nbiological importance of the\n", "What is Photosynthesis & Light Reactions": "Before we jump into photosynthesis\n\u2013 did you know\u2026.\n\nAccording to estimates provided globally, the number of deaths directly\nlinked to AMR has risen to more than 1.2 million in 2019 and this is forecast\nto increase to approximately 10 million deaths per year by 2050\n\nAbdallah, E.M.; Alhatlani, B.Y.;\nde Paula Menezes, R.; Martins,\nC.H.G. Back to Nature:\nMedicinal Plants as Promising\nSources for Antibacterial Drugs\nin the Post-Antibiotic Era.\nPlants 2023, 12, 3077.\nhttps://doi.org/10.3390/\nplants12173077\n\nPlants are exceptionally important in\nmedicine!\n\nRemember from topic 1\nPhotosynthetic organisms changed Earth\u2019s atmosphere.\nThe earliest prokaryotes supplied their energy needs by taking in small\nmolecules from their environment, breaking the chemical bonds of\nthese molecules, and using the energy released from those chemical\nbonds to do cellular work.\nBut about 2.5 billion years ago, the emergence of photosynthesis\nchanged the nature of life on Earth and also changed our planet.\nDuring the early history of prokaryotic life, there was very little O 2 in\nEarth\u2019s atmosphere.\n\nOver time, photosynthetic prokaryotes became so abundant that vast\nquantities of oxygen gas (O2), a by-product of photosynthesis, began to\naccumulate in the atmosphere.\nMars is just like Earth was, next to no O 2 in the atmosphere.\n\n4\n\nLearning Outcomes\nAt the end of this lecture, you should be able to:\n1. Recall the location of photosynthesis in plants,\nalgae, cyanobacteria\n2. Explain how light energy is converted to\nchemical energy in the light-dependent reactions\nthe cellular components and chemical\nprocesses involved\n3. List the inputs and outputs of the lightdependent reactions\n\nhttps://elevatedac hievement.com /articles/why-measurable-and-achievable-learning-outcomes-are-imperative-to-eac h-and-every-lesson\n\nLet\u2019s revise\nWhich is the complete balanced equation for the generation of hexose\nfrom sunlight, water, and oxygen?\na) 6 CO2 + 6 H2O \u2192 C6H12O6 + O2\nb) 6 CO2 + 12 H2O \u2192 C6H12O6 + 6 O2 + 6 H2O\nc) 6 CO2 + 6 H2O \u2192 C6H12O6 + 6 O2\nd) 12 CO2 + 12 H2O \u2192 2 C6H12O6 + 2 O2\n\n6\n\nEnergy in\nbiological\nsystems\n\nUrry, L. A., Cain, M. L., Wasserman, S. A., Minorsky, P. V., Orr, R.\n(20200102). Campbell Biology, 12th Edition [VitalSource Bookshelf\nversion]. Retrieved from vbk://9780135858141\n\nOxygenic photosynthesis\n\u2022 Involves light and gas exchange\n\u2022 Conversion of carbon dioxide and water into\n\n\u2022 carbohydrates and oxygen\n\u2022 Endergonic reaction\n\nOxygenic photosynthesis\n\nChloroplast\n\nThe site of photosynthesis\n\u2022 All green parts of a plant, including green stems and\nunripened fruit, have chloroplasts, but the leaves are\nthe major sites of photosynthesis in most plants.\n\u2022 Chloroplasts are found mainly in the cells of the\nmesophyll, the tissue in the interior of the leaf.\n\n\u2022 CO2 enters the leaf, and O2 exits, by way of\nmicroscopic pores called stomata\n\u2022 Water absorbed by the roots is delivered to the leaves\nin veins.\n\u2022 A typical mesophyll cell has about 30\u201340 chloroplasts,\neach measuring about 2\u20134 \u00b5m by 4\u20137 \u00b5m.\nPage [10]\n\nThe site of photosynthesis\n\u2022 A chloroplast has two membranes surrounding a dense\nfluid called the stroma.\n\u2022 Suspended within the stroma is a third membrane system,\nmade up of sacs called thylakoids, which segregates the\nstroma from the thylakoid space inside these sacs.\n\u2022 chlorophyll, the green pigment that gives leaves their\ncolour, resides in the thylakoid membranes of the\nchloroplast.\n\u2022 It is the light energy absorbed by chlorophyll that drives\nthe synthesis of ", "Photosynthesis: The Dark Reactions": "Before the\ndark\nreactions\u2026\u2026\n\nPage [2]\n\nBut plants can help\u2026\u2026.\n\nSu H, van Eerde A, Rimstad E, Bock R, Branza-Nichita N, Yakovlev IA and Clarke JL (2023) Plant-made vaccines against\nviral diseases in humans and farm animals. Front. Plant Sci. 14:1170815. doi: 10.3389/fpls.2023.1170815\n\nPage [3]\n\nLearning outcomes\nLearning outcomes:\nAt the end of this lecture, you should be able to:\n\n1. Explain the light-independent reactions and the\ncellular components and chemical processes\ninvolved\n2. List the inputs and outputs of the lightindependent reactions\n3. Compare and contrast C3, C4 and CAM\nphotosynthesis\n\nhttps://elevatedac hievement.com /articles/why-measurable-and-achievable-learning-outcomes-are-imperative-to-eac h-and-every-lesson\n\nCarbon fixation\n(light\nindependent\nreactions)\n\nPlants have adapted\nPhotorespiration\n\nRubisco is a carboxylase, but can also act as\nan oxygenase, adding O2 to RuBP instead of\nCO2.\nRuBP + O2 \u2192 phosphoglycolate + 3PG\nPhosphoglycolate inhibits reactions in the\nCalvin cycle and has to be eliminated.\n\n10\n\nLet\u2019s Revise\nPhotosynthesis Overview\nQuestion\n\nMy answer\n\nThe Calvin cycle begins when CO2\nreacts with ..\n\nDistinguish between how rubisco\nacts to make RuBP and how it\noxidizes RuBP.\n12\n\nRemember Plants have adapted\n\u2022 Reaction of RuBP with O2 instead of\nCO2 reduces net carbon fixed by the Calvin\ncycle by 25%.\n\u2022 The affinity of rubisco for CO2 is much\nstronger than it is for O2.\n\u2022 But if there is relatively high O2 and low\nCO2 concentrations within the leaf,\noxygenase activity is favored.\n\u2022 This can occur on hot, dry days\u2014leaf\nstomata close to prevent water loss and\nO2 levels increase relative to CO2.\n\nPlants\nhave\nadapted\n\nBelk, C., Maier, V. B. (20180109). Biology: Science for\nLife with Physiology, 6th Edition. [VitalSource Bookshelf\n9.4.3]. Retrieved from vbk://9780134819075\n\n14\n\nCAM plants\nCrassulacean acid metabolism\n(CAM)\n\u2022 Stomata are open at night and\nclosed during the day to conserve\nwater.\n\n\u2022 Night: CO2 is fixed by PEP\ncarboxylase, and malate is stored in\nvacuoles.\n\u2022 Day: malate moves to chloroplasts\nand is decarboxylated and the CO2\ngoes into the Calvin cycle.\nUrry, L. A., Cain, M. L., Wasserman, S. A., Minorsky, P. V., Orr, R. (20200102). Campbell Biology, 12th Edition [VitalSource Bookshelf version]. Retrieved from vbk://9780135858141\n\nLet\u2019s Revise\nPlant adaptions\nQuestion\n\nMy answer\n\nIn C4 plants, C4 and C3 pathways\noccur at different _______________,\nwhereas in CAM plants, CAM and C3\npath-ways occur at different\n_______________.\n\n19\n\nLet's revise\n\nDo C3, C4 and CAM plants all have rubisco?\nWhat about PEP carboxylase?\nPage [20]\n\nLet\u2019s Revise\nPlant adaptions\nQuestion\n\nMy answer\n\nDo C3, C4 and CAM plants all have\nrubisco?\n\nWhat about PEP carboxylase?\n\n21\n\nBrain Teaser\nPlant adaptions\nBiotechnologists are trying to genetically modify C3 plants to convert them to C4\nor CAM plants.\nQuestion\n\nMy answer\n\nWhy would this be useful?\nWhat genes might you introduce\ninto C3 plants to convert them to C4\nor CAM plants?\n22\n\nSummary\n\u2022 Photosynthesis is the ultimate source of all\nchemical energy and organic molecules\navailable to photoautotrophs, such as\nplants, and to virtually all other organisms\nas well.\n\u2022 It also constantly replenishes the supply of\noxygen in the atmosphere, vital to all\naerobic organisms.\n\u2022 Photosynthesis occurs in 2 stages:\n\u2022 The light dependent reactions and the\ncarbon fixation reactions.\n\u2022 Plants have evolved to suit different\nclimates resulting in different pathways.\nPage [23]\n\nUp next\n\n\u2022 Cellula", "Cell Signalling": "Learning Outcomes\nAt the end of this lecture, you should be able to:\n\u2022\n\nUse the source and distribution mechanism of a\nsignal to identify its type.\n\n\u2022\n\nExplain how specificity is achieved in a signal\ntransduction pathway.\n\n\u2022\n\nExplain how and why different cells respond to\ndifferent chemical signals.\n\nReference for cell signaling:\n\u2022\n\nAlberts, B., Bray, D., Hopkin, K., Johnson, A. D., Lewis, J., Raff, M., Robe, K. (2013-10-01). Essential\nCell Biology, 4th Edition. - Chapter 16, pg 526\n\n\u2022\n\nHillis, D., Heller, H. C., Hacker, S. D., Hall, D., Sadava, D., Laskowski, M. (20200215). Life: The\nScience of Biology, 12th Edition. - Chapter 7 pg 133\nhttps://elevatedac hievement.com/articles/why-measurable-and-achievable-learning-outcomes-are-imperative-to-eac h-and-every-lesson/\n\nRemember:\nEnergy balance is vital\n\n3\n\nMetabolic reactions are being regulated\n\n4\n\nBrain Teaser\nRegulation of processes\nMy answer\n\nHow do cells know\nwhen to undertake\nmetabolic processes\n(e.g. replicate, use\nenergy, create energy,\nphotosynthesise etc)?\n\n5\n\nCell to Cell Communicaiton\n\u2022 Individual cells, like multicellular organisms, need\nto sense and respond to their environment.\n\u2022 A free-living cell\u2014even a humble bacterium\u2014must\nbe able to track down nutrients, tell the difference\nbetween light and dark, and avoid poisons and\npredators.\n\n\u2022 And if such a cell is to have any kind of \u201csocial life,\u201d\nit must be able to communicate with other cells.\n\u2022 Information can come in a variety of forms, and\ncommunication frequently involves converting the\nsignals that carry that information from one form to\nanother\n6\n\nDifferent chemical signals\n\n\u2022 Autocrine signals affect the cells that\nmade them\n\u2022 Juxtacrine signals affect only adjacent\ncells\n\u2022 Paracrine signals affect nearby cells\n\u2022 Hormones travel to distant\ncells, usually via the circular system\n\n8\n\nSome\nexamples of\ndifferent types\nof signals\n\nFor context only:\ndo not memorize these!!!\n\n9\n\nBrain Teaser\nPlant adaptions\nIt seems counterintuitive that a cell, having a perfectly abundant supply of nutrients\navailable, would commit suicide if not constantly stimulated by signals from other cells\nQuestion\n\nMy answer\n\nWhat do you\nsuppose might be\nthe advantages\nof such\nregulation?\n\n10\n\nSignal detection\nMembrane receptors:\n\u2012 Large or polar ligands cannot cross the lipid bilayer.\n\n\u2012 Insulin, for example, is a protein hormone that cannot diffuse\nthrough the cell membrane; instead, it binds to a\ntransmembrane receptor with an extracellular binding domain.\n\nIntracellular receptors:\n\u2012 Small or nonpolar ligands can diffuse across the nonpolar\nphospholipid bilayer of the cell membrane and enter the cell.\n\u2012 The hormone oestrogen, for example, is a lipid-soluble steroid\nthat can diffuse across the cell membrane; it binds to a receptor\ninside the cell.\n12\n\nLet\u2019s Revise\nCellular receptors\nQuestion\n\nMy answer\n\nWhy do protein hormones such as\ninsulin require membrane-bound\nreceptors rather than intracellular\nreceptors?\nWhy are G-protein-coupled receptors\n(GPCRs) particularly effective at\namplifying cellular signals?\n19\n\nBrain Teaser\nThe taste test\nThere are five basic tastes\u2014sour, salty, sweet, bitter, and \u201cumami.\u201d\nSalt is detected when the concentration of salt outside of a taste bud cell is\nhigher than that inside of it, and ion channels allow the passive leakage\nof Na+ into the cell. The resulting change in membrane potential sends the\n\u201csalty\u201d signal to the brain.\nUmami is a savoury taste generated by glutamate (glutamic acid, found in\nmonosodium glutama"}, "Module 3 \u2013 Genes & Heredity": {"Mutations are the source of genetic variation": "Learning outcomes\nBy the end of this lecture, you will be able to interpret information about mutations\nand predict their likely consequences on the function of genes.\nThis includes being able to:\n\u2022 Recognise the importance of mutations as the primary source of genetic variation\n\u2022 Describe the different terms used to classify mutations\n\u2022 Explain how DNA mutations affect RNA and polypeptide sequence\n\nPage [4]\n\nMutations are the primary source of genetic variation\n\nMutations are a change in\nthe sequence, structure or\ncomposition of the genome\nof an organism.\n- may/may not affect genes\n- may/may not be\ntransmitted to offspring\n\nPage [5]\n\nConsider life without mutation\nWhat would happen if genetic material (DNA) was perfectly stable (un-mutable)?\n\nMutations create variation\n\nEmlen & Zimmer, Evolution: Making Sense of Life, (2020) Figures 6.19, 10.8, 6.16\n\nBeneficial\n\nLethal\nNo effect - neutral\n\nMutations are classified in multiple ways\nNote- The terms are provided in your glossary for you to write a description and example\n\nHow the mutations occur\n\nWhether or not they can be passed to offspring\n\nSize/scale of the mutation\n\nLocation within genes\nPage [8]\n\nMutations are classified in multiple ways\nNote- The terms are provided in your glossary for you to write a description and example\n\nChange to polypeptide sequence or abundance\n\nEffect on gene function\n\nEffect on fitness\n\nPage [9]\n\nMutations can be spontaneous\nExample 1. Error during DNA replication\nAt most one mutation per billion nucleotides\n\nExample 2. Chemical changes to nucleotide bases such as Deamination\n(removal of an NH2 amino group)\n\nC\n\nU\n\nMutations can be induced\n\u2022 Chemical agents:\n\u2022 Nitrous acid: cause deamination\n\u2022 Benzopyrene: adds chemical group to guanine\n\n\u2022 Radiation:\n\u2022 X-rays and gamma-rays can break sugarphosphate backbone of DNA\n\u2022 Ultraviolet radiation can cause covalent bonds\nbetween adjacent thymine bases.\n\nHeritability of mutations in multicellular\norganisms\n\nSmall scale DNA mutations\nMutations affecting\n\nnucleotides\n\n\u2022 Point mutation or SNP (single nucleotide polymorphisms) \u2013 affect a single\nnucleotide\n\u2022 Indels - Small insertions or deletions\n\u2022 Microsatellite or SSLP (Simple sequence length polymorphisms) - a short\nsequence of 1-6 nucleotides with variable numbers of repeats\n\nPage [13]\n\nLarge scale chromosomal mutations\nMutations affecting large regions or entire chromosomes\n\nTranslocation\n\nDeletion\n\ngenetic\ninformation\n\nwhole chromosome\n\ngenetic\ninformation\n\nInversion\n\nDuplication\n\ngenetic\ninformation\n\nPage [14]\n\nMutations can occur anywhere in the genome\n(Not just in sequences that code for polypeptides)\nGenomes include genes\nand intergenic regions\nIntragenic regions\ninclude coding\nsequences (exons) and\nintervening sequences\n(introns) of genes that\nare transcribed into RNA\n\nIntrons are removed from\nthe pre-mRNA before\ntranslation\n\nThink-pair-share\nConsider each of the following mutations.\n\u2022\n\nAn insertion involving an expansion of an SSLP in an intergenic region\nduring spermatogenesis\n\n\u2022\n\u2022\n\nAn induced mutation in a skin cell affecting a pigmentation gene\nA SNP that causes a cell cycle gene to be unable to be turned off\n\nRank the mutations in terms of their likely effect on an organism and its\nsurvival.\n\nPage [16]\n\nMutations within genes\nHow can mutations within genes affect the polypeptide produced?\nWild-type (normal)\nDNA\nstrand\n\nmRNA\ntranscript\n\nPolypeptide\n\nPage [17]\n\nSilent mutations\nChange to the nucleotide sequence but not the polypeptide sequence\nWild-type (nor", "Understanding how genes influence traits": "Learning outcomes\nBy the end of this lecture, you will be able to explain the relationship between genes,\nchromosomes, alleles, ploidy and phenotypes.\nThis includes being able to:\n\u2022 Distinguish the key genetic terms used to describe genotypes and phenotypes.\n\u2022 Describe the concept of dominance and recessivity, as well as incomplete and codominance at the molecular level.\n\nLet's check in\nGenetic information present in DNA which is assembled into structures\ncalled chromosomes.\nGenetic information is heritable and chromosomes are transmitted from\none generation to the next. Lecture 19 & 22 (next lecture)\nMutation changes DNA sequences resulting in differences inherited genetic\ngenetic variation. Lecture 20\nGenes are expressed into gene products (mainly proteins) and genetic\nvariation can result in gene products with altered functions. Lecture 20\n\nOur understanding of genetics\nBEFORE the first genetic studies looking at how traits were inherited\nwere conducted, which of the following had already been\ndemonstrated?\n1. Genetic information is present in DNA which is assembled into structures called\nchromosomes.\n2. Genetic information is heritable, being transmitted from one cell to another and\nfrom one generation to the next.\n4. Genes are expressed into gene products (mainly proteins) and genetic\nvariation can result in gene products with altered functions.\n\nPloidy : Number of sets of chromosomes\nDiploid (2n)\n\nHaploid (n)\nBefore DNA\nreplication\nCh I\n\nAfter DNA\nreplication\n\nBefore DNA\nreplication\n\nAfter DNA\nreplication\n\nCh I x2\n\nCh II\n\nCh II x2\n\nHomologous chromosomes\n(non-identical)\n\nNote- Independent of the number of different chromosomes an organism has\n\nPloidy : Number of sets of chromosomes\nDiploid (2n)\n\nHaploid (n)\nBefore DNA\nreplication\nCh I\n\nAfter DNA\nreplication\nCh I\n\nCh II\n\n2 chromosomes\nCh II\n\n2 chromosomes\n\nBefore DNA\nreplication\nCh I x2\n\nCh II x2\n\n4 chromosomes\n\nEach chromosome has\nTWO sister chromatids\n\nNote- same chromosome number is shown pre/post-DNA replication\n\nAfter DNA\nreplication\n\nPloidy : Number of sets of chromosomes\nKey concept- many sexual organisms cycle between different states of ploidy\n\nn\n\nFertilisation\n\n2n\n\nn\n\nMeiosis\nNote- unreplicated chromosomes are shown\n\nMeiosis covered in Lecture 22\n\nLocus: the location of a specific gene or DNA\nsequence\nKey concept- a locus is found in the same location on a pair of\n\nDiploid (2n)\n\nHaploid (n)\nCh I\n\nLocus A\n\nchromosomes\n\nCh I x2\n\nLocus A\n\nCh II
